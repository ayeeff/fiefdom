<!DOCTYPE html>
<html lang="en">
<head>
  <style> 
    body { margin: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    #ui-controls {
      position: absolute; top: 20px; right: 20px; z-index: 100;
      display: flex; gap: 10px;
    }
    button {
      background: rgba(0, 255, 255, 0.1); border: 1px solid #0ff; color: #0ff;
      padding: 10px 20px; cursor: pointer; text-transform: uppercase;
      font-weight: bold; letter-spacing: 1px; backdrop-filter: blur(4px);
      transition: all 0.3s ease;
    }
    button:hover { background: rgba(0, 255, 255, 0.3); box-shadow: 0 0 15px #0ff; }
    
    #legend {
      position: absolute; bottom: 20px; left: 20px; color: #fff;
      background: rgba(0,0,0,0.7); padding: 15px; border-left: 3px solid #0ff;
      font-size: 14px; max-width: 300px;
    }
    h1 { margin: 0 0 5px 0; font-size: 18px; color: #0ff; }
    p { margin: 0; opacity: 0.8; }
    .label-mel { color: #ffab00; }
    .label-syd { color: #0088ff; }
  </style>

  <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
  <div id="ui-controls">
    <button onclick="focusMel()">Melbourne (The Spine)</button>
    <button onclick="focusSyd()">Sydney (The Crossing)</button>
  </div>

  <div id="legend">
    <h1>CBD Gravity Shift</h1>
    <p>Visualizing the new high-capacity spines.</p>
    <br>
    <p><span style="color: #ffab00;">●</span> <b>Melbourne:</b> Re-centering the grid along Swanston St.</p>
    <p><span style="color: #0088ff;">●</span> <b>Sydney:</b> Bridging the Harbour & unlocking Barangaroo.</p>
  </div>

  <div id="globeViz"></div>

  <script>
    // --- DATASETS --- //
    
    // Melbourne Metro Tunnel Stations (Approx Lat/Lon)
    const melbourneStations = [
      { name: "Arden", lat: -37.802, lng: 144.942, val: 1 },
      { name: "Parkville", lat: -37.799, lng: 144.958, val: 1.5 },
      { name: "State Library", lat: -37.810, lng: 144.964, val: 3 }, // High Gravity
      { name: "Town Hall", lat: -37.815, lng: 144.967, val: 3 },    // High Gravity
      { name: "Anzac", lat: -37.833, lng: 144.972, val: 2 }
    ];

    // Sydney Metro City & SW (Key CBD Section)
    const sydneyStations = [
      { name: "Victoria Cross", lat: -33.839, lng: 151.207, val: 2 },
      { name: "Barangaroo", lat: -33.864, lng: 151.202, val: 2.5 },
      { name: "Martin Place", lat: -33.868, lng: 151.211, val: 3 },  // High Gravity
      { name: "Gadigal", lat: -33.873, lng: 151.208, val: 2.5 },
      { name: "Central", lat: -33.884, lng: 151.206, val: 3 },
      { name: "Waterloo", lat: -33.895, lng: 151.205, val: 1.5 },
      { name: "Sydenham", lat: -33.916, lng: 151.168, val: 1 }
    ];

    // Combine Points
    const allPoints = [
      ...melbourneStations.map(s => ({ ...s, color: '#ffab00', city: 'mel' })), 
      ...sydneyStations.map(s => ({ ...s, color: '#0088ff', city: 'syd' }))
    ];

    // Create Arcs (Tunnels) - Linking the stations sequentially
    const createArcs = (stations, color) => {
      let arcs = [];
      for (let i = 0; i < stations.length - 1; i++) {
        arcs.push({
          startLat: stations[i].lat,
          startLng: stations[i].lng,
          endLat: stations[i+1].lat,
          endLng: stations[i+1].lng,
          color: color
        });
      }
      return arcs;
    };

    const allArcs = [
      ...createArcs(melbourneStations, '#ffab00'),
      ...createArcs(sydneyStations, '#0088ff')
    ];

    // --- GLOBE INITIALIZATION --- //

    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .pointsData(allPoints)
      .pointAltitude(d => d.val * 0.005) // Altitude based on "Gravity" importance
      .pointColor('color')
      .pointRadius(0.25)
      .pointLabel('name')
      .arcsData(allArcs)
      .arcColor('color')
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(1500)
      .arcStroke(0.5)
      .labelsData(allPoints)
      .labelLat(d => d.lat)
      .labelLng(d => d.lng)
      .labelText(d => d.name)
      .labelSize(0.3)
      .labelDotRadius(0.1)
      .labelColor(() => 'rgba(255, 255, 255, 0.75)')
      .labelResolution(2);

    // --- CONTROLS --- //
    
    // Initial View (Zoomed out to see Australia)
    world.pointOfView({ lat: -35, lng: 148, altitude: 2.5 });

    function focusMel() {
      world.pointOfView({ lat: -37.81, lng: 144.96, altitude: 0.05 }, 2000);
    }

    function focusSyd() {
      world.pointOfView({ lat: -33.87, lng: 151.21, altitude: 0.05 }, 2000);
    }
  </script>
</body>
</html>
