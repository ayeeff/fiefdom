<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metro Comparison: Melbourne vs Sydney</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { margin: 0; padding: 0; background: #111; font-family: 'Segoe UI', sans-serif; }
    
    /* Layout Container */
    #container {
      display: flex;
      flex-direction: row; /* Side by side on desktop */
      height: 100vh;
      width: 100%;
    }

    /* Map Dimensions */
    .map-wrapper {
      flex: 1;
      position: relative;
      border-right: 2px solid #333;
    }
    
    #melbtrain, #sydtrain {
      height: 100%;
      width: 100%;
    }

    /* Titles over the maps */
    .map-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      pointer-events: none;
      border-bottom: 3px solid;
    }

    /* Specific Border Colors */
    .title-mel { border-color: #ffab00; }
    .title-syd { border-color: #0088ff; }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      #container { flex-direction: column; }
      .map-wrapper { height: 50vh; border-right: none; border-bottom: 2px solid #333; }
    }
  </style>
</head>
<body>

  <div id="container">
    <div class="map-wrapper">
      <div class="map-title title-mel">Melbourne (The Spine)</div>
      <div id="melbtrain"></div>
    </div>

    <div class="map-wrapper">
      <div class="map-title title-syd">Sydney (The Crossing)</div>
      <div id="sydtrain"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // --- CONFIGURATION --- //
    // Dark matter tiles for high contrast
    const tileUrl = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
    const attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';

    // --- MELBOURNE DATA --- //
    const melbStations = [
      { name: "Arden", coords: [-37.802, 144.942] },
      { name: "Parkville", coords: [-37.799, 144.958] },
      { name: "State Library", coords: [-37.810, 144.964] },
      { name: "Town Hall", coords: [-37.815, 144.967] },
      { name: "Anzac", coords: [-37.833, 144.972] }
    ];
    // Line connecting them
    const melbLine = melbStations.map(s => s.coords);

    // --- SYDNEY DATA --- //
    const sydStations = [
      { name: "Victoria Cross", coords: [-33.839, 151.207] },
      { name: "Barangaroo", coords: [-33.864, 151.202] },
      { name: "Martin Place", coords: [-33.868, 151.211] },
      { name: "Gadigal", coords: [-33.873, 151.208] },
      { name: "Central", coords: [-33.884, 151.206] },
      { name: "Waterloo", coords: [-33.895, 151.205] },
      { name: "Sydenham", coords: [-33.916, 151.168] }
    ];
    // Line connecting them
    const sydLine = sydStations.map(s => s.coords);


    // --- INITIALIZE MAPS --- //

    // 1. Setup melbtrain
    const mapMelb = L.map('melbtrain').setView([-37.813, 144.96], 13);
    L.tileLayer(tileUrl, { attribution }).addTo(mapMelb);

    // Add Melbourne Path
    L.polyline(melbLine, { color: '#ffab00', weight: 5, opacity: 0.9 }).addTo(mapMelb);

    // Add Melbourne Markers
    melbStations.forEach(s => {
      L.circleMarker(s.coords, {
        color: '#ffab00', fillColor: '#000', fillOpacity: 1, radius: 6, weight: 2
      }).addTo(mapMelb).bindPopup(`<b>${s.name}</b>`);
    });


    // 2. Setup sydtrain
    const mapSyd = L.map('sydtrain').setView([-33.87, 151.205], 13);
    L.tileLayer(tileUrl, { attribution }).addTo(mapSyd);

    // Add Sydney Path
    L.polyline(sydLine, { color: '#0088ff', weight: 5, opacity: 0.9 }).addTo(mapSyd);

    // Add Sydney Markers
    sydStations.forEach(s => {
      L.circleMarker(s.coords, {
        color: '#0088ff', fillColor: '#000', fillOpacity: 1, radius: 6, weight: 2
      }).addTo(mapSyd).bindPopup(`<b>${s.name}</b>`);
    });

  </script>
</body>
</html>
