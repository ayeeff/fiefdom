<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Yankee Betrayal Playbook</title>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0c10;
            color: #c5c6c7;
            overflow: hidden;
        }

        /* --- CUSTOM PALETTE --- */
        .text-british { color: #8e44ad; }
        .text-yankee { color: #002868; }
        .text-nato { color: #ffffff; text-shadow: 0 0 5px #000; }

        /* Main Container */
        .wolfpack-wp {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #0b0c10;
            overflow: hidden;
        }

        /* Globe Container */
        #wolfpack-globe-wp { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0;
            z-index: 1; 
        }

        /* --- TOP BANNER --- */
        .top-banner {
            position: absolute; 
            top: 0; 
            left: 50%; 
            transform: translateX(-50%);
            width: 100%; 
            max-width: 1200px;
            background: rgba(11, 12, 16, 0.95); 
            backdrop-filter: blur(16px);
            border-bottom-left-radius: 20px; 
            border-bottom-right-radius: 20px;
            padding: 24px 30px; 
            text-align: center; 
            z-index: 30;
            border-bottom: 2px solid #002868;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        
        .top-title {
            font-size: 2.2rem; 
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(90deg, #8e44ad 0%, #ffffff 50%, #002868 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text;
            letter-spacing: 2px; 
            margin-bottom: 12px; 
            line-height: 1.1;
        }
        
        .top-subtitle {
            font-size: 1.0rem; 
            line-height: 1.6; 
            color: #c5c6c7;
            max-width: 950px; 
            margin: 0 auto;
            font-weight: 400;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        /* --- LEFT TOWER (The Dossier) --- */
        .tower-container {
            position: absolute; 
            top: 200px;
            bottom: 120px; 
            width: 380px;
            overflow-y: auto; 
            z-index: 20;
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            padding-right: 8px; 
            scrollbar-width: thin; 
            scrollbar-color: #002868 transparent;
        }
        
        .tower-left { left: 30px; }

        /* Jenga Block Styles */
        .jenga-block {
            background: rgba(11, 12, 16, 0.9); 
            backdrop-filter: blur(10px);
            border-left: 6px solid #333; 
            border-radius: 4px;
            padding: 15px 18px; 
            color: white;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.6);
            transition: all 0.5s ease;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0; 
            transform: translateX(-50px);
        }
        
        @keyframes slideIn { 
            to { 
                opacity: 1; 
                transform: translateX(0); 
            } 
        }

        .block-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 8px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 5px;
        }
        
        .block-name { 
            font-weight: 800; 
            font-size: 1.0rem; 
            letter-spacing: 0.05em; 
            color: #fff; 
            text-transform: uppercase;
        }
        
        .block-year { 
            font-size: 0.75rem; 
            font-weight: 700; 
            padding: 2px 8px; 
            border-radius: 4px; 
            background: #222; 
        }
        
        .block-desc { 
            font-size: 0.85rem; 
            color: #cbd5e1; 
            line-height: 1.5; 
        }

        /* Theme Colors for Blocks */
        .block-british { border-left-color: #8e44ad; }
        .block-british .block-year { color: #8e44ad; border: 1px solid #8e44ad; }
        
        .block-yankee { border-left-color: #002868; }
        .block-yankee .block-year { color: #4fa3ff; border: 1px solid #002868; background: #00102a;}

        .block-nato { border-left-color: #ffffff; }
        .block-nato .block-year { color: #ffffff; border: 1px solid #999; background: #333; }

        /* --- BOTTOM NAVIGATION BAR --- */
        .nav-container {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 95%; 
            max-width: 1000px;
            background: rgba(11, 12, 16, 0.95); 
            backdrop-filter: blur(12px);
            border: 1px solid #333; 
            border-radius: 10px;
            padding: 12px 20px; 
            z-index: 30;
            box-shadow: 0 10px 40px rgba(0,0,0,1);
            display: flex; 
            justify-content: center;
            gap: 20px;
        }

        .nav-pill {
            padding: 10px 20px; 
            border-radius: 5px; 
            font-size: 0.8rem; 
            font-weight: 700;
            cursor: pointer; 
            white-space: nowrap; 
            transition: all 0.2s;
            border: 1px solid #444; 
            background: rgba(255,255,255,0.05); 
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .nav-pill:hover { 
            background: rgba(255,255,255,0.15); 
            color: white; 
            border-color: #666; 
        }
        
        .nav-pill.active { 
            background: #002868; 
            border-color: #4fa3ff; 
            color: #fff; 
            box-shadow: 0 0 10px rgba(0, 40, 104, 0.5); 
        }
        
        /* Responsive */
        @media screen and (max-width: 782px) {
            .wolfpack-wp { height: 600px; }
            .tower-container { 
                top: auto; 
                bottom: 100px; 
                height: 200px; 
                width: 90%; 
                left: 5%; 
            }
            .top-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="wolfpack-wp">
        
        <div id="wolfpack-globe-wp"></div>

        <div class="top-banner">
            <div class="top-title">The Yankee Betrayal Playbook</div>
            <div class="top-subtitle">
                From the <strong>Crimean War</strong> to the <strong>Hague Rug-Pull</strong>: Using American industry to subordinate Anglo cousins.
            </div>
        </div>

        <div class="tower-container tower-left" id="wolfpack-leftTower-wp"></div>

        <div class="nav-container">
            <div class="nav-pill active" onclick="jumpToYankeePhase(0)">1. Crimea & The Industrialists (1850s)</div>
            <div class="nav-pill" onclick="jumpToYankeePhase(1)">2. NATO & The Rug Pull (2025)</div>
        </div>

    </div>

    <script>
    (function() {
        // ==================== DATASETS ====================

        // ERA 1: 19th Century
        const eraOneData = [
            {
                type: 'british',
                name: 'The Crimean War',
                year: '1853-1856',
                description: 'Fought between the Russian Empire and an alliance of the Ottoman Empire, France, UK, and Sardinia. <strong>Mission:</strong> Contain Russia.',
                pathCoords: [[51.5, -0.1], [36.1, -5.3], [35.9, 14.4], [44.6, 33.5]],
                pathColor: '#8e44ad',
                markers: [
                    { lat: 51.5, lng: -0.1, label: 'London', color: '#8e44ad' },
                    { lat: 44.6, lng: 33.5, label: 'Sevastopol', color: '#8e44ad' }
                ],
                highlightCountries: ['United Kingdom', 'France', 'Turkey', 'Italy'],
                highlightColor: 'rgba(142, 68, 173, 0.6)'
            },
            {
                type: 'yankee',
                name: 'The Yankee Counter-Move',
                year: '1858',
                description: '<strong>Webb, Whistler & Winans:</strong> While Britain fought, Americans built the St. Petersburg-Moscow rail and the frigate <em>General Admiral</em>.',
                pathCoords: [[40.7, -74.0], [55.0, -30.0], [59.9, 30.3], [55.7, 37.6]], 
                pathColor: '#002868',
                markers: [
                    { lat: 40.7, lng: -74.0, label: 'New York (Webb)', color: '#002868' },
                    { lat: 39.3, lng: -76.6, label: 'Baltimore (Winans)', color: '#002868' },
                    { lat: 59.9, lng: 30.3, label: 'St. Petersburg', color: '#002868' }
                ],
                highlightCountries: ['Russia'],
                highlightColor: 'rgba(0, 40, 104, 0.6)'
            }
        ];

        // ERA 2: 21st Century
        const eraTwoData = [
            {
                type: 'nato',
                name: 'NATO Expansion',
                year: '1999-2004',
                description: 'Choropleth map turning Eastern Europe <strong>White</strong>. The market opening for US Defense Primes.',
                pathCoords: [],
                pathColor: '#ffffff',
                markers: [
                    { lat: 50.8, lng: 4.3, label: 'NATO HQ', color: '#ffffff' },
                    { lat: 52.2, lng: 21.0, label: 'Warsaw', color: '#ffffff' }
                ],
                highlightCountries: ['Poland', 'Hungary', 'Czechia', 'Estonia', 'Latvia', 'Lithuania', 'Romania', 'Bulgaria', 'Slovakia', 'Slovenia'],
                highlightColor: 'rgba(255, 255, 255, 0.8)'
            },
            {
                type: 'yankee',
                name: 'The 2025 Strategy',
                year: '2025',
                description: '<strong>Phase 1:</strong> Hollow Force (1999-2020)<br><strong>Phase 2:</strong> Fire Sale (2022-2024)<br><strong>Phase 3:</strong> The Hague Rug-Pull (2025)',
                pathCoords: [[38.9, -77.0], [50.0, -30.0], [50.8, 4.3]],
                pathColor: '#002868',
                markers: [
                    { lat: 38.9, lng: -77.0, label: 'Washington', color: '#002868' },
                    { lat: 52.0, lng: 4.3, label: 'The Hague', color: '#002868' }
                ],
                highlightCountries: ['United States'],
                highlightColor: 'rgba(0, 40, 104, 0.6)'
            }
        ];

        // ==================== APP LOGIC ====================

        let globe;
        let activeCountries = new Set(); 
        let activeHighlightColor = 'rgba(255,255,255,0.1)';
        
        let currentPaths = [];
        let currentMarkers = [];

        function checkLibs() {
            if (typeof Globe !== 'undefined' && typeof topojson !== 'undefined') {
                initGlobe();
            } else {
                setTimeout(checkLibs, 100);
            }
        }

        async function initGlobe() {
            const resp = await fetch('https://unpkg.com/world-atlas/countries-110m.json');
            const topo = await resp.json();
            const countries = topojson.feature(topo, topo.objects.countries).features;

            globe = Globe()(document.getElementById('wolfpack-globe-wp'))
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .pointOfView({ lat: 48, lng: 15, altitude: 1.8 })
                .polygonsData(countries)
                .polygonCapColor(d => {
                    if (activeCountries.has(d.properties.name) || activeCountries.has(d.properties.name_long)) {
                        return activeHighlightColor;
                    }
                    return 'rgba(20, 20, 25, 0.8)';
                })
                .polygonSideColor(() => 'rgba(0,0,0,0)')
                .polygonStrokeColor(() => '#222')
                .polygonsTransitionDuration(800)
                .pathPoints('coords')
                .pathPointLat(p => p[0])
                .pathPointLng(p => p[1])
                .pathColor(d => d.color)
                .pathStroke(3)
                .pathDashLength(0.5)
                .pathDashGap(0.1)
                .pathDashAnimateTime(2000)
                .htmlElementsData([]);

            window.jumpToYankeePhase(0);
        }

        window.jumpToYankeePhase = function(phaseIndex) {
            document.querySelectorAll('.nav-pill').forEach((el, idx) => {
                if(idx === phaseIndex) el.classList.add('active');
                else el.classList.remove('active');
            });

            const container = document.getElementById('wolfpack-leftTower-wp');
            container.innerHTML = '';
            currentPaths = [];
            currentMarkers = [];
            activeCountries.clear();
            globe.polygonsData(globe.polygonsData());

            const sequence = phaseIndex === 0 ? eraOneData : eraTwoData;
            runSequenceSteps(sequence, 0);
        }

        function runSequenceSteps(sequence, index) {
            if (index >= sequence.length) return;

            const step = sequence[index];

            addJengaBlock(step);

            if(step.pathCoords.length > 0) {
                currentPaths.push({ coords: step.pathCoords, color: step.pathColor });
            }
            if(step.markers) {
                step.markers.forEach(m => currentMarkers.push(m));
            }

            activeHighlightColor = step.highlightColor;
            step.highlightCountries.forEach(c => activeCountries.add(c));
            
            globe.pathsData([...currentPaths]);
            globe.htmlElementsData(currentMarkers.map(m => createMarker(m)));
            globe.polygonsData(globe.polygonsData());

            setTimeout(() => runSequenceSteps(sequence, index + 1), 1500);
        }

        function addJengaBlock(step) {
            const container = document.getElementById('wolfpack-leftTower-wp');
            
            const block = document.createElement('div');
            let typeClass = 'block-yankee';
            if(step.type === 'british') typeClass = 'block-british';
            if(step.type === 'nato') typeClass = 'block-nato';

            block.className = `jenga-block ${typeClass}`;
            
            block.innerHTML = `
                <div class="block-header">
                    <span class="block-name">${step.name}</span>
                    <span class="block-year">${step.year}</span>
                </div>
                <div class="block-desc">${step.description}</div>
            `;
            
            container.appendChild(block);
            container.scrollTop = container.scrollHeight;
        }

        function createMarker(d) {
            const el = document.createElement('div');
            el.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div style="width:10px; height:10px; background:${d.color}; border:2px solid white; border-radius:50%; box-shadow:0 0 10px ${d.color};"></div>
                    <div style="background:rgba(0,0,0,0.8); color:${d.color}; padding:2px 6px; border-radius:4px; font-size:10px; margin-top:4px; font-weight:bold; white-space:nowrap; border: 1px solid ${d.color};">${d.label}</div>
                </div>
            `;
            return el;
        }

        checkLibs();

    })();
    </script>
</body>
</html>
