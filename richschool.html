-header-image{width:100%;max-width:800px;margin:0 auto 2rem;border-radius:1rem}.richestschools-school-card{background:rgba(30,41,59,0.5);backdrop-filter:blur(20px);border-radius:0.75rem;padding:1rem;border:1px solid #334155;cursor:pointer;transition:all 0.2s}.richestschools-school-card:hover{transform:scale(1.02);box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)}.richestschools-school-card.richestschools-card-selected{border-color:#fbbf24!important;box-shadow:0 10px 15px -3px rgba(251,191,36,0.3)!important}.richestschools-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.75rem}.richestschools-card-left{display:flex;gap:0.75rem;align-items:center;flex:1}.richestschools-logo{width:3rem;height:3rem;object-fit:contain;background:white;padding:0.25rem;border-radius:0.5rem}.richestschools-selected-logo{width:4rem;height:4rem;object-fit:contain;background:white;padding:0.5rem;border-radius:0.5rem;margin-bottom:1rem}.richestschools-school-card h3{font-size:1.25rem;font-weight:bold;color:#f0f9ff}.richestschools-school-card .richestschools-location{color:#94a3b1;font-size:0.875rem;margin-top:0.25rem}.richestschools-badge{padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.75rem;font-weight:bold;color:white;white-space:nowrap}.richestschools-rank{font-size:1.5rem;font-weight:bold;color:#fbbf24;margin-right:0.5rem}.richestschools-card-bottom{font-size:0.875rem;line-height:1.5;color:#cbd5e1;margin-top:0.75rem}.richestschools-income{font-size:1.25rem;font-weight:bold;color:#fbbf24}.richestschools-custom-marker{background:none!important;border:none!important}</style></head><body class="richestschools-body"><div class="richestschools-container"><div class="richestschools-header"><img src="" alt="Header Image" class="richestschools-header-image" style="display:none;" id="richestschools-header-img"><h1>Victoria's Richest Private Schools</h1><p>Ranked by Median Family Income (2024)</p></div><div class="richestschools-stats-grid"><div class="richestschools-stat-card"><div class="richestschools-flex"><svg class="richestschools-icon richestschools-icon-gold" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><div><div class="richestschools-label">Total Schools</div><div class="richestschools-value">13</div></div></div></div><div class="richestschools-stat-card"><div class="richestschools-flex"><svg class="richestschools-icon richestschools-icon-green" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><div><div class="richestschools-label">Highest Income</div><div class="richestschools-value">$380k</div></div></div></div><div class="richestschools-stat-card"><div class="richestschools-flex"><svg class="richestschools-icon richestschools-icon-blue" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><div><div class="richestschools-label">Avg Income</div><div class="richestschools-value">$327k</div></div></div></div><div class="richestschools-stat-card"><div class="richestschools-flex"><svg class="richestschools-icon richestschools-icon-red" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h-8a6 6 0 0 0 0 12h8"/><path d="M16 3v18"/></svg><div><div class="richestschools-label">vs Avg Australian</div><div class="richestschools-value">4x</div></div></div></div></div><div class="richestschools-interactive-section" id="richestschools-interactive"><div class="richestschools-map-container"><h2>Melbourne Metropolitan Area</h2><div id="richestschools-map" class="richestschools-map"></div><div class="richestschools-legend"><div class="richestschools-legend-item"><div class="richestschools-color richestschools-tier1"></div><span>Top Tier ($380k)</span></div><div class="richestschools-legend-item"><div class="richestschools-color richestschools-tier2"></div><span>Second Tier ($350-365k)</span></div><div class="richestschools-legend-item"><div class="richestschools-color richestschools-tier3"></div><span>Third Tier ($325-350k)</span></div><div class="richestschools-legend-item"><div class="richestschools-color richestschools-tier4"></div><span>Additional ($257-302k)</span></div></div></div><div class="richestschools-selected-school-container" id="richestschools-details"><button class="richestschools-close-button" onclick="window.richestschoolsCloseDetails()">×</button><img id="richestschools-selected-logo" src="" alt="" class="richestschools-selected-logo"><h3 id="richestschools-selected-name"></h3><h4 id="richestschools-selected-location"></h4><div class="richestschools-income-display" id="richestschools-selected-income"></div><div class="richestschools-stats-row"><div class="richestschools-stat-item"><div class="richestschools-stat-label">Rank</div><div class="richestschools-stat-value" id="richestschools-selected-rank"></div></div><div class="richestschools-stat-item"><div class="richestschools-stat-label">Tier</div><div class="richestschools-stat-value" id="richestschools-selected-tier"></div></div></div></div></div><div class="richestschools-schools-grid" id="richestschools-grid"></div></div><script>(function(){const ns='richestschools_'+Math.random().toString(36).substr(2,9);const schools=[{rank:1,name:"Mount Scopus Memorial College",location:"Burwood",lat:-37.8525,lon:145.1194,income:380000,tier:"Top Tier"},{rank:2,name:"Christ Church Grammar School",location:"South Yarra",lat:-37.8435,lon:144.9945,income:365000,tier:"Second Tier"},{rank:3,name:"Loreto Mandeville Hall",location:"Toorak",lat:-37.8417,lon:145.0133,income:365000,tier:"Second Tier"},{rank:4,name:"Scotch College",location:"Hawthorn",lat:-37.8220,lon:145.0330,income:355000,tier:"Second Tier"},{rank:5,name:"Melbourne Grammar School",location:"South Yarra",lat:-37.8302,lon:144.9847,income:336000,tier:"Third Tier"},{rank:6,name:"Melbourne Girls Grammar",location:"South Yarra",lat:-37.8350,lon:144.9950,income:325000,tier:"Third Tier"},{rank:7,name:"St Michael's Grammar",location:"St Kilda",lat:-37.8677,lon:144.9885,income:350000,tier:"Third Tier"},{rank:8,name:"St Leonard's College",location:"Brighton East",lat:-37.9113,lon:145.0064,income:350000,tier:"Third Tier"},{rank:9,name:"Lauriston Girls' School",location:"Armadale",lat:-37.8550,lon:145.0165,income:350000,tier:"Third Tier"},{rank:10,name:"Brighton Grammar School",location:"Brighton",lat:-37.9167,lon:144.9968,income:302000,tier:"Third Tier"},{rank:11,name:"Carey Baptist Grammar School",location:"Kew",lat:-37.8030,lon:145.0360,income:300000,tier:"Additional"},{rank:12,name:"Caulfield Grammar School",location:"Caulfield",lat:-37.8770,lon:145.0240,income:257000,tier:"Additional"},{rank:13,name:"Wesley College",location:"Glen Waverley",lat:-37.8800,lon:145.1590,income:271000,tier:"Additional"}];const getTierColor=(tier)=>{const colors={"Top Tier":'#fbbf24',"Second Tier":'#f59e0b',"Third Tier":'#d97706',"Additional":'#b45309'};return colors[tier]||'#6b7280'};const formatIncome=(income)=>{return `$${(income/1000).toFixed(0)}k`};let selectedSchool=null;window.richestschoolsCloseDetails=function(){if(selectedSchool){setSelectedSchool(selectedSchool)}};const setSelectedSchool=(school)=>{const interactiveSection=document.getElementById('richestschools-interactive');const container=document.getElementById('richestschools-details');if(selectedSchool&&selectedSchool.rank===school.rank){if(interactiveSection)interactiveSection.classList.remove('richestschools-selected');if(container)container.style.display='none';if(window[ns+'_map']){setTimeout(()=>{window[ns+'_map'].setView([-37.87,145.09],12);window[ns+'_map'].invalidateSize()},150)}selectedSchool=null;const cards=document.querySelectorAll('.richestschools-school-card');cards.forEach(c=>c.classList.remove('richestschools-card-selected'));return}if(selectedSchool){const cards=document.querySelectorAll('.richestschools-school-card');cards.forEach(c=>c.classList.remove('richestschools-card-selected'))}const targetCard=Array.from(document.querySelectorAll('.richestschools-school-card')).find(c=>c.querySelector('h3').textContent===school.name);if(targetCard)targetCard.classList.add('richestschools-card-selected');selectedSchool=school;if(container)container.style.display='block';const logoEl=document.getElementById('richestschools-selected-logo');const nameEl=document.getElementById('richestschools-selected-name');const locationEl=document.getElementById('richestschools-selected-location');const incomeEl=document.getElementById('richestschools-selected-income');const rankEl=document.getElementById('richestschools-selected-rank');const tierEl=document.getElementById('richestschools-selected-tier');if(logoEl)logoEl.style.display='none';if(nameEl)nameEl.textContent=school.name;if(locationEl)locationEl.textContent=school.location;if(incomeEl)incomeEl.textContent=`${formatIncome(school.income)} Median Family Income`;if(rankEl)rankEl.textContent=`#${school.rank}`;if(tierEl)tierEl.textContent=school.tier;if(interactiveSection)interactiveSection.classList.add('richestschools-selected');if(window[ns+'_map']){setTimeout(()=>{window[ns+'_map'].invalidateSize();window[ns+'_map'].setView([school.lat,school.lon],14)},150)}};const initMap=()=>{if(!window.L||!document.getElementById('richestschools-map'))return;if(window[ns+'_map'])return;const L=window.L;const map=L.map('richestschools-map').setView([-37.87,145.09],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);schools.forEach(school=>{const color=getTierColor(school.tier);const size=24+(school.rank<=3?8:0);const icon=L.divIcon({className:'richestschools-custom-marker',html:`<div style="background-color:${color};width:${size}px;height:${size}px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:12px;">${school.rank}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});const marker=L.marker([school.lat,school.lon],{icon}).addTo(map);marker.bindPopup(`<strong>#${school.rank} ${school.name}</strong><br>${school.location}<br>${formatIncome(school.income)} median income`);marker.on('click',()=>setSelectedSchool(school))});window[ns+'_map']=map};const renderSchoolCards=()=>{const grid=document.getElementById('richestschools-grid');if(!grid)return;grid.innerHTML=schools.map(school=>{const color=getTierColor(school.tier);return `<div class="richestschools-school-card" data-school="${school.name}"><div class="richestschools-card-top"><div class="richestschools-card-left"><span class="richestschools-rank">#${school.rank}</span><div><h3>${school.name}</h3><div class="richestschools-location">${school.location}</div></div></div><div class="richestschools-badge" style="background-color:${color}">${school.tier}</div></div><div class="richestschools-card-bottom"><div class="richestschools-income">${formatIncome(school.income)} Median Family Income</div></div></div>`}).join('');document.querySelectorAll('.richestschools-school-card').forEach(card=>{card.addEventListener('click',()=>{const schoolName=card.dataset.school;const school=schools.find(s=>s.name===schoolName);if(school)setSelectedSchool(school)})})};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>{renderSchoolCards();const link=document.createElement('link');link.rel='stylesheet';link.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';document.head.appendChild(link);const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';script.async=true;script.onload=()=>initMap();document.body.appendChild(script)})}else{renderSchoolCards();initMap()}})();</script></body></html>
