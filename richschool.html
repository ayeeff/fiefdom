All('.richestschools-school-card')).find(c=>c.querySelector('h3').textContent===school.name);if(targetCard)targetCard.classList.add('richestschools-card-selected');selectedSchool=school;if(container)container.style.display='block';const logoEl=document.getElementById('richestschools-selected-logo');const nameEl=document.getElementById('richestschools-selected-name');const locationEl=document.getElementById('richestschools-selected-location');const incomeEl=document.getElementById('richestschools-selected-income');const rankEl=document.getElementById('richestschools-selected-rank');const tierEl=document.getElementById('richestschools-selected-tier');if(logoEl)logoEl.style.display='none';if(nameEl)nameEl.textContent=school.name;if(locationEl)locationEl.textContent=school.location;if(incomeEl)incomeEl.textContent=`${formatIncome(school.income)} Median Family Income`;if(rankEl)rankEl.textContent=`#${school.rank}`;if(tierEl)tierEl.textContent=school.tier;if(interactiveSection)interactiveSection.classList.add('richestschools-selected');if(window[ns+'_map']){setTimeout(()=>{window[ns+'_map'].invalidateSize();window[ns+'_map'].setView([school.lat,school.lon],14)},150)}};const initMap=()=>{if(!window.L||!document.getElementById('richestschools-map'))return;if(window[ns+'_map'])return;const L=window.L;const map=L.map('richestschools-map').setView([-37.87,145.09],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);schools.forEach(school=>{const color=getTierColor(school.tier);const size=24+(school.rank<=3?8:0);const icon=L.divIcon({className:'richestschools-custom-marker',html:`<div style="background-color:${color};width:${size}px;height:${size}px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:12px;">${school.rank}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});const marker=L.marker([school.lat,school.lon],{icon}).addTo(map);marker.bindPopup(`<strong>#${school.rank} ${school.name}</strong><br>${school.location}<br>${formatIncome(school.income)} median income`);marker.on('click',()=>setSelectedSchool(school))});window[ns+'_map']=map};const renderSchoolCards=()=>{const grid=document.getElementById('richestschools-grid');if(!grid)return;grid.innerHTML=schools.map(school=>{const color=getTierColor(school.tier);return `<div class="richestschools-school-card" data-school="${school.name}"><div class="richestschools-card-top"><div class="richestschools-card-left"><span class="richestschools-rank">#${school.rank}</span><div><h3>${school.name}</h3><div class="richestschools-location">${school.location}</div></div></div><div class="richestschools-badge" style="background-color:${color}">${school.tier}</div></div><div class="richestschools-card-bottom"><div class="richestschools-income">${formatIncome(school.income)} Median Family Income</div></div></div>`}).join('');document.querySelectorAll('.richestschools-school-card').forEach(card=>{card.addEventListener('click',()=>{const schoolName=card.dataset.school;const school=schools.find(s=>s.name===schoolName);if(school)setSelectedSchool(school)})})};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>{renderSchoolCards();const link=document.createElement('link');link.rel='stylesheet';link.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';document.head.appendChild(link);const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';script.async=true;script.onload=()=>initMap();document.body.appendChild(script)})}else{renderSchoolCards();initMap()}})();</script></body></html>
