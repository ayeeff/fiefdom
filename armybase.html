<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Military Bases Global Map</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            pointer-events: none;
            z-index: 100;
        }
        #info h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #4FC3F7;
        }
        #info p {
            margin: 5px 0;
            line-height: 1.4;
        }
        #legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
        }
        #legend h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .legend-item {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="globeViz"></div>
    <div id="info" style="display: none;">
        <h3 id="baseName"></h3>
        <p><strong>Country:</strong> <span id="country"></span></p>
        <p><strong>Branch:</strong> <span id="branch"></span></p>
        <p><strong>Personnel:</strong> <span id="personnel"></span></p>
        <p><strong>Annual Cost:</strong> <span id="cost"></span></p>
        <p><strong>Rank:</strong> <span id="rank"></span></p>
    </div>
    <div id="legend">
        <h4>Branch</h4>
        <div class="legend-item">
            <span class="legend-color" style="background: #FF5252;"></span>
            <span>Army</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #448AFF;"></span>
            <span>Air Force</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #00BCD4;"></span>
            <span>Navy</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #4CAF50;"></span>
            <span>Marines</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #9C27B0;"></span>
            <span>Multi/Space Force</span>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl@2.31.0/dist/globe.gl.min.js"></script>

            {rank:36,name:"Pituffik Space Base",country:"Greenland",branch:"Space Force",personnel:2500,cost:"~240M",lat:76.5312,lon:-68.7031},
            {rank:37,name:"Naval Station Guantanamo Bay",country:"Cuba",branch:"Navy",personnel:2500,cost:"~240M",lat:19.9380,lon:-75.1600},

            {rank:46,name:"USAG Vilseck",country:"Germany",branch:"Army",personnel:1400,cost:"~130M",lat:49.6333,lon:11.7833},
            {rank:47,name:"USAG Rheinland-Pfalz",country:"Germany",branch:"Army",personnel:1300,cost:"~120M",lat:49.6333,lon:7.3333},
            {rank:48,name:"USAG Sembach",country:"Germany",branch:"Army",personnel:1200,cost:"~110M",lat:49.5167,lon:7.8500},
            {rank:49,name:"USAG Kleber, Kaiserslautern",country:"Germany",branch:"Army",personnel:1100,cost:"~100M",lat:49.4333,lon:7.7500},
            {rank:50,name:"USAG Panzer Kaserne",country:"Germany",branch:"Army",personnel:1000,cost:"~95M",lat:48.6333,lon:9.0333}
        ];

        const branchColors = {
            'Army': '#FF5252',
            'Air Force': '#448AFF',
            'Navy': '#00BCD4',
            'Marines': '#4CAF50',
            'Multi': '#9C27B0',
            'Space Force': '#9C27B0'
        };

        const maxPersonnel = Math.max(...bases.map(b => b.personnel));
        const minPersonnel = Math.min(...bases.map(b => b.personnel));

        const globe = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe@2.24.9/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe@2.24.9/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe@2.24.9/example/img/night-sky.png')
            .pointsData(bases)
            .pointLat('lat')
            .pointLng('lon')
            .pointColor(d => branchColors[d.branch] || '#FFFFFF')
            .pointAltitude(0.01)
            .pointRadius(d => {
                const ratio = (d.personnel - minPersonnel) / (maxPersonnel - minPersonnel);
                return 0.2 + ratio * 0.8;
            })
            .pointLabel(d => `
                <div style="background: rgba(0,0,0,0.9); padding: 10px; border-radius: 5px; color: white;">
                    <strong>${d.name}</strong><br/>
                    ${d.country}<br/>
                    ${d.branch} - ${d.personnel.toLocaleString()} personnel
                </div>
            `)
            .onPointClick(d => {
                document.getElementById('baseName').textContent = d.name;
                document.getElementById('country').textContent = d.country;
                document.getElementById('branch').textContent = d.branch;
                document.getElementById('personnel').textContent = d.personnel.toLocaleString();
                document.getElementById('cost').textContent = d.cost;
                document.getElementById('rank').textContent = `#${d.rank}`;
                document.getElementById('info').style.display = 'block';
            });

        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.5;

        globe.pointOfView({ lat: 30, lng: 30, altitude: 2.5 }, 1000);
        });
    </script>
</body>
</html>
