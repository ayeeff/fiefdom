<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wolf Pack Snake Path</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            prefix: 'wolf-',
            corePlugins: { preflight: false }
        }
    </script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    
    <style>
        #wolfviz { 
            width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; 
            z-index: 1; background: #02040a;
        }
        /* UI Styles */
        .wolf-ui-panel {
            position: fixed; top: 20px; left: 20px; width: 320px;
            background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px;
            padding: 20px; z-index: 10; font-family: sans-serif; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .wolf-title { font-size: 1.2rem; font-weight: 800; color: #38bdf8; margin-bottom: 5px; }
        .wolf-desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
        
        .wolf-btn {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px;
            background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
            cursor: pointer; text-align: left; transition: all 0.2s;
            font-weight: 600; display: flex; justify-content: space-between;
        }
        .wolf-btn:hover { background: #334155; color: white; }
        .wolf-btn.active-blue { background: #0ea5e9; color: white; border-color: #38bdf8; box-shadow: 0 0 15px rgba(14,165,233,0.4); }
        .wolf-btn.active-green { background: #22c55e; color: white; border-color: #4ade80; box-shadow: 0 0 15px rgba(34,197,94,0.4); }

        .wolf-progress-bar {
            height: 4px; background: #334155; border-radius: 2px; margin-top: 15px; overflow: hidden;
        }
        .wolf-progress-fill {
            height: 100%; width: 0%; background: #38bdf8; transition: width 0.5s ease;
        }
        
        .step-label {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 10px 24px; border-radius: 30px;
            border: 1px solid #333; color: #fff; font-weight: bold; font-family: sans-serif;
            opacity: 0; transition: opacity 0.5s; z-index: 10;
        }
    </style>
</head>
<body>

<div id="wolfviz"></div>

<div class="wolf-ui-panel">
    <div class="wolf-title" id="panel-title">THE WOLF SCOUTS</div>
    <div class="wolf-desc" id="panel-desc">Tracing the path step-by-step.</div>
    
    <button class="wolf-btn active-blue" id="btn-ancient" onclick="playScenario('ancient')">
        <span>🛶 Ancient Scouts</span>
        <span>5000 BP</span>
    </button>
    
    <button class="wolf-btn" id="btn-modern" onclick="playScenario('modern')">
        <span>🚢 Reunion Tour</span>
        <span>2019-2024</span>
    </button>

    <div class="wolf-progress-bar">
        <div class="wolf-progress-fill" id="prog-bar"></div>
    </div>
</div>

<div class="step-label" id="step-toast">Departing...</div>

<script>
let globe;
let animationInterval;
let currentPathData = [];
let currentPointsData = [];

// ==================== SEQUENTIAL DATA ====================
// These arrays define the "Snake Game" order step-by-step.

const scenarios = {
    ancient: {
        color: '#38bdf8', // Blue
        title: "THE WOLF SCOUTS DEPART",
        desc: "Step-by-step migration from Taiwan to Aotearoa.",
        // The sequence of steps
        steps: [
            { 
                label: "Start: Taiwan", 
                loc: { name: "Taiwan", lat: 23.69, lng: 120.96, desc: "Origin" },
                path: null // First point has no path leading to it
            },
            { 
                label: "Step 1: To Luzon", 
                loc: { name: "Luzon", lat: 16.56, lng: 121.26, desc: "Philippines" },
                path: [[23.69, 120.96], [16.56, 121.26]]
            },
            { 
                label: "Step 2: To Sulawesi", 
                loc: { name: "Sulawesi", lat: -2.5, lng: 119.5, desc: "Indonesia" },
                path: [[16.56, 121.26], [5, 125], [-2.5, 119.5]]
            },
            { 
                label: "Step 3: The Long Jump to Fiji", 
                loc: { name: "Fiji", lat: -17.71, lng: 178.06, desc: "Melanesia" },
                path: [[-2.5, 119.5], [-5, 145], [-10, 160], [-17.71, 178.06]]
            },
            { 
                label: "Step 4: To Tonga", 
                loc: { name: "Tonga", lat: -21.17, lng: -175.19, desc: "Polynesia" },
                path: [[-17.71, 178.06], [-21.17, -175.19]]
            },
            { 
                label: "Step 5: To Samoa", 
                loc: { name: "Samoa", lat: -13.75, lng: -172.10, desc: "Navigator Hub" },
                path: [[-21.17, -175.19], [-13.75, -172.10]]
            },
            { 
                label: "Step 6: To Hawai'i", 
                loc: { name: "Hawai'i", lat: 19.89, lng: -155.58, desc: "Northern Apex" },
                path: [[-13.75, -172.10], [0, -165], [19.89, -155.58]]
            },
            { 
                label: "Final Step: To Aotearoa", 
                loc: { name: "Aotearoa", lat: -40.90, lng: 174.88, desc: "Southern Apex" },
                path: [[19.89, -155.58], [-10, -160], [-40.90, 174.88]] 
                // Note: Tracing Hawaii to NZ to make it a continuous snake, 
                // though historically Samoa -> NZ is more direct. 
                // Use [[-13.75, -172.10], [-40.90, 174.88]] if you want to branch from Samoa.
            }
        ]
    },
    modern: {
        color: '#4ade80', // Green
        title: "THE REUNION TOUR",
        desc: "China's infrastructure path through the Pacific (2019-2024).",
        steps: [
            { 
                label: "Start: Beijing", 
                loc: { name: "Beijing", lat: 39.90, lng: 116.40, desc: "PRC HQ" },
                path: null 
            },
            { 
                label: "1. To Tonga (Courthouse/Loans)", 
                loc: { name: "Tonga", lat: -21.17, lng: -175.19, desc: "Loans & Infra" },
                path: [[39.90, 116.40], [10, 140], [-21.17, -175.19]]
            },
            { 
                label: "2. To Samoa (Police Academy)", 
                loc: { name: "Samoa", lat: -13.75, lng: -172.10, desc: "Police Academy" },
                path: [[-21.17, -175.19], [-13.75, -172.10]]
            },
            { 
                label: "3. To Solomon Islands (Wharf)", 
                loc: { name: "Solomon Is.", lat: -9.64, lng: 160.15, desc: "New Wharf" },
                path: [[-13.75, -172.10], [-12, 180], [-9.64, 160.15]]
            },
            { 
                label: "4. To Kiribati (Fisheries)", 
                loc: { name: "Kiribati", lat: 1.87, lng: -157.36, desc: "Fisheries Pier" },
                path: [[-9.64, 160.15], [0, 170], [1.87, -157.36]]
            },
            { 
                label: "5. To Fiji (Great Wall Stadium)", 
                loc: { name: "Fiji", lat: -17.71, lng: 178.06, desc: "Stadium/Hydro" },
                path: [[1.87, -157.36], [-10, 180], [-17.71, 178.06]]
            }
        ]
    }
};

// ==================== INITIALIZATION ====================

async function initGlobe() {
    const resp = await fetch('https://unpkg.com/world-atlas/countries-110m.json');
    const topo = await resp.json();
    const countries = topojson.feature(topo, topo.objects.countries).features;

    globe = Globe()(document.getElementById('wolfviz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pointOfView({ lat: 5, lng: 165, altitude: 2.2 })
        .polygonsData(countries)
        .polygonCapColor(() => 'rgba(30, 41, 59, 0.4)')
        .polygonSideColor(() => 'rgba(0,0,0,0.2)')
        .polygonStrokeColor(() => '#111')
        .pathPoints('coords')
        .pathPointLat(p => p[0])
        .pathPointLng(p => p[1])
        .pathColor(d => d.color)
        .pathStroke(3)
        .pathDashLength(0.5)
        .pathDashGap(0.1)
        .pathDashAnimateTime(2000) // Fast dash animation
        .htmlElementsData([])
        .htmlElement(d => {
            const el = document.createElement('div');
            el.innerHTML = `
                <div style="width:14px; height:14px; background:${d.color}; border:2px solid white; border-radius:50%; box-shadow:0 0 10px ${d.color};"></div>
                <div style="color:${d.color}; font-family:sans-serif; font-weight:bold; font-size:12px; margin-top:4px; text-shadow:0 2px 4px black; white-space:nowrap;">${d.name}</div>
            `;
            return el;
        });

    // Start default scenario
    playScenario('ancient');
}

// ==================== ANIMATION ENGINE ====================

function playScenario(scenarioKey) {
    // 1. Reset State
    if (animationInterval) clearInterval(animationInterval);
    currentPathData = [];
    currentPointsData = [];
    globe.pathsData([]).htmlElementsData([]); // Clear globe
    
    // 2. UI Updates
    const data = scenarios[scenarioKey];
    document.getElementById('panel-title').innerText = data.title;
    document.getElementById('panel-title').style.color = data.color;
    document.getElementById('panel-desc').innerText = data.desc;
    document.getElementById('prog-bar').children[0].style.backgroundColor = data.color;
    document.getElementById('prog-bar').children[0].style.width = '0%';
    
    // Buttons toggle
    document.getElementById('btn-ancient').className = `wolf-btn ${scenarioKey === 'ancient' ? 'active-blue' : ''}`;
    document.getElementById('btn-modern').className = `wolf-btn ${scenarioKey === 'modern' ? 'active-green' : ''}`;

    // 3. Start Sequence Loop
    let stepIndex = 0;
    
    // Process Step 0 immediately (The Origin Point)
    addStep(data, stepIndex);
    stepIndex++;

    animationInterval = setInterval(() => {
        if (stepIndex >= data.steps.length) {
            clearInterval(animationInterval);
            showToast("Destination Reached");
            return;
        }
        addStep(data, stepIndex);
        stepIndex++;
        
        // Update Progress Bar
        const pct = (stepIndex / data.steps.length) * 100;
        document.getElementById('prog-bar').children[0].style.width = pct + '%';

    }, 2000); // 2 seconds per jump
}

function addStep(scenarioData, index) {
    const step = scenarioData.steps[index];
    
    // Show Toast
    showToast(step.label);

    // Add Point
    if (step.loc) {
        currentPointsData.push({
            lat: step.loc.lat,
            lng: step.loc.lng,
            name: step.loc.name,
            color: scenarioData.color
        });
        globe.htmlElementsData(currentPointsData);
    }

    // Add Path (if not start point)
    if (step.path) {
        currentPathData.push({
            coords: step.path,
            color: scenarioData.color
        });
        globe.pathsData(currentPathData);
    }

    // Optional: Move camera to follow the snake?
    // globe.pointOfView({ lat: step.loc.lat, lng: step.loc.lng, altitude: 2 }, 1000);
}

function showToast(text) {
    const el = document.getElementById('step-toast');
    el.innerText = text;
    el.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; }, 1800);
}

initGlobe();
</script>
</body>
</html>
