<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Pack & BRI Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #02040a; font-family: system-ui, -apple-system, sans-serif; }
        
        #globeViz { 
            width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; 
            z-index: 1; 
        }

        /* --- TOP BANNER --- */
        .top-banner {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 1200px;
            background: rgba(15,18,28,0.96); backdrop-filter: blur(12px);
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            padding: 24px 40px; text-align: center; z-index: 30;
            border-bottom: 1px solid rgba(70,80,100,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .top-title {
            font-size: 2.2rem; font-weight: 900;
            background: linear-gradient(135deg, #3b82f6, #22c55e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: 1.5px; margin-bottom: 8px; line-height: 1.2;
        }
        .top-subtitle {
            font-size: 1.1rem; line-height: 1.65; color: #e2e8f0;
            max-width: 1000px; margin: 0 auto;
        }

        /* --- TOWERS COMMON STYLES --- */
        .tower-container {
            position: fixed; top: 200px; bottom: 100px; width: 320px;
            overflow-y: auto; z-index: 20;
            display: flex; flex-direction: column; gap: 10px;
            padding-right: 4px; scrollbar-width: thin; scrollbar-color: #334155 transparent;
        }
        .tower-left { left: 20px; }
        .tower-right { right: 20px; }

        /* Jenga Block Styles */
        .jenga-block {
            background: rgba(15,23,42,0.85); backdrop-filter: blur(8px);
            border-left: 4px solid #333; border-radius: 8px;
            padding: 14px; color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0; transform: translateY(20px);
        }
        
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        .block-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .block-name { font-weight: 800; font-size: 0.95rem; letter-spacing: 0.05em; width: 70%; }
        .block-year { font-size: 0.8rem; font-weight: 600; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
        .block-desc { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; }

        /* Theme Colors */
        .block-ancient { border-left-color: #3b82f6; }
        .block-ancient .block-year { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        
        .block-modern { border-left-color: #22c55e; }
        .block-modern .block-year { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

        /* --- BOTTOM NAVIGATION BAR --- */
        .nav-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1000px;
            background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 20px;
            padding: 15px 20px; z-index: 30;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; gap: 12px;
        }

        .nav-row { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: thin; }
        .nav-label { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; min-width: 80px; text-align: right; margin-right: 10px; }

        .nav-pill {
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
            border: 1px solid transparent; background: rgba(30, 41, 59, 0.5); color: #94a3b8;
        }
        .nav-pill:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-pill.ancient-active { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #60a5fa; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .nav-pill.modern-active { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #4ade80; box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }

    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="top-banner">
    <div class="top-title">THE WOLF PACK of the South Pacific</div>
    <div class="top-subtitle">
        5000 YEARS before Europeans arrived in the PACIFIC. From outrigger canoes carrying pigs and taro to Belt-and-Road ships carrying cranes and fiber optics.
    </div>
</div>

<div class="tower-container tower-left" id="leftTower"></div>

<div class="tower-container tower-right" id="rightTower"></div>

<div class="nav-container">
    <div class="nav-row" id="ancient-nav-row">
        <div class="nav-label text-blue-400">Wolf Scouts</div>
    </div>
    <div class="nav-row" id="modern-nav-row">
        <div class="nav-label text-green-400">BRI Reunion</div>
    </div>
</div>

<script>
// ==================== DATASETS ====================

const ancientSequence = [
    {
        id: 'taiwan', label: 'Fujian/Taiwan', name: 'The Origin',
        coords: [], 
        color: '#3b82f6', year: '~3000 BCE',
        description: 'Villagers in Fujian and Taiwan built the first outrigger canoes.',
        countryName: 'Taiwan', markers: ['Fujian', 'Taiwan']
    },
    {
        id: 'luzon', label: 'Luzon', name: 'Taiwan → Luzon',
        coords: [[25.0, 121.0], [20.0, 121.5], [14.6, 121.0]],
        color: '#3b82f6', year: '~2500 BCE',
        description: 'First island hop across the Luzon Strait.',
        countryName: 'Philippines', markers: ['Luzon']
    },
    {
        id: 'sulawesi', label: 'Sulawesi', name: 'Luzon → Sulawesi',
        coords: [[14.6, 121.0], [10.0, 122.0], [5.0, 120.0], [-2.0, 120.3]],
        color: '#3b82f6', year: '~2000 BCE',
        description: 'Expansion into the Indonesian archipelago.',
        countryName: 'Indonesia', markers: ['Sulawesi']
    },
    {
        id: 'fiji', label: 'Fiji', name: 'Sulawesi → Fiji',
        coords: [[-2.0, 120.3], [-5.0, 130.0], [-10.0, 145.0], [-15.0, 165.0], [-17.7, 178.1]],
        color: '#3b82f6', year: '~1500 BCE',
        description: 'Great leap across open Pacific to Melanesia.',
        countryName: 'Fiji', markers: ['Fiji']
    },
    {
        id: 'tonga', label: 'Tonga', name: 'Fiji → Tonga',
        coords: [[-17.7, 178.1], [-21.2, -175.2]],
        color: '#3b82f6', year: '~1200 BCE',
        description: 'Polynesian heartland established.',
        countryName: 'Tonga', markers: ['Tonga']
    },
    {
        id: 'samoa', label: 'Samoa', name: 'Tonga → Samoa',
        coords: [[-21.2, -175.2], [-13.8, -172.1]],
        color: '#3b82f6', year: '~1000 BCE',
        description: 'The Navigator Hub.',
        countryName: 'Samoa', markers: ['Samoa']
    },
    {
        id: 'hawaii', label: 'Hawai\'i', name: 'Samoa → Hawai\'i',
        coords: [[-13.8, -172.1], [-5.0, -165.0], [5.0, -160.0], [15.0, -157.0], [21.3, -157.8]],
        color: '#3b82f6', year: '~500 CE',
        description: 'Northern voyages to Hawaiian islands.',
        countryName: null, markers: ['Hawai\'i']
    },
    {
        id: 'nz', label: 'Aotearoa', name: 'Samoa → Aotearoa',
        coords: [[-13.8, -172.1], [10.0, -165.0], [-10.0, 175.0], [-30.0, 175.0], [-41.3, 174.8]],
        color: '#3b82f6', year: '~800 CE',
        description: 'Settlement of New Zealand (Aotearoa).',
        countryName: 'New Zealand', markers: ['Aotearoa']
    },
    {
        id: 'madagascar', label: 'Madagascar', name: 'Sulawesi → Madagascar',
        coords: [[-2.0, 120.3], [-5.0, 100.0], [-10.0, 80.0], [-15.0, 60.0], [-18.76, 46.86]],
        color: '#3b82f6', year: '~700 CE',
        description: 'The western expansion: Outriggers crossing the Indian Ocean.',
        countryName: 'Madagascar', markers: ['Madagascar']
    }
];

const briSequence = [
    {
        id: 'start_bri', label: 'China', name: 'BRI Launch',
        coords: [], color: '#22c55e', year: '2013',
        description: 'The Belt and Road Initiative begins.',
        markers: ['Beijing']
    },
    { 
        id: 'bri_tonga', label: 'Tonga', name: 'China → Tonga', 
        coords: [[25.0, 121.0], [10.0, 150.0], [-5.0, 170.0], [-21.2, -175.2]], 
        color: '#22c55e', year: '2019', 
        description: 'Courthouse construction & development loans', 
        markers: ['Tonga'] 
    }, 
    { 
        id: 'bri_samoa', label: 'Samoa', name: 'Tonga → Samoa', 
        coords: [[-21.2, -175.2], [-18.0, -174.0], [-13.8, -172.1]], 
        color: '#22c55e', year: '2021', 
        description: 'Police academy construction', 
        markers: ['Samoa'] 
    }, 
    { 
        id: 'bri_solomons', label: 'Solomon Is.', name: 'Samoa → Solomon Islands', 
        coords: [[-13.8, -172.1], [-10.0, -165.0], [-5.0, 160.0], [-9.4, 159.9]], 
        color: '#22c55e', year: '2023', 
        description: 'Major wharf construction project', 
        markers: ['Solomon Islands'] 
    }, 
    { 
        id: 'bri_kiribati', label: 'Kiribati', name: 'Solomon Islands → Kiribati', 
        coords: [[-9.4, 159.9], [-5.0, 165.0], [0.0, 170.0], [1.4, 173.0]], 
        color: '#22c55e', year: '2023', 
        description: 'Fisheries pier development', 
        markers: ['Kiribati'] 
    }, 
    { 
        id: 'bri_fiji', label: 'Fiji', name: 'Kiribati → Fiji', 
        coords: [[1.4, 173.0], [-5.0, 175.0], [-12.0, 178.0], [-17.7, 178.1]], 
        color: '#22c55e', year: '2023', 
        description: 'Hydropower, roads & "Great Wall" cricket stadium', 
        markers: ['Fiji'] 
    } 
];

// ==================== APP LOGIC ====================

let globe;
let visitedCountries = new Set(); 
let animationTimeout;
let displayedPaths = [];
let displayedMarkers = [];

async function initGlobe() {
    const resp = await fetch('https://unpkg.com/world-atlas/countries-110m.json');
    const topo = await resp.json();
    const countries = topojson.feature(topo, topo.objects.countries).features;

    globe = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pointOfView({ lat: -8, lng: 145, altitude: 2.5 })
        .polygonsData(countries)
        .polygonCapColor(d => {
            if (visitedCountries.has(d.properties.name)) {
                return 'rgba(59, 130, 246, 0.6)'; // Blue tint
            }
            return 'rgba(30, 41, 59, 0.4)'; // Default dark
        })
        .polygonSideColor(() => 'rgba(0,0,0,0.2)')
        .polygonStrokeColor(() => '#111')
        .polygonsTransitionDuration(800)
        .pathPoints('coords')
        .pathPointLat(p => p[0])
        .pathPointLng(p => p[1])
        .pathColor(d => d.color)
        .pathStroke(3)
        .pathDashLength(0.5)
        .pathDashGap(0.1)
        .pathDashAnimateTime(2000)
        .htmlElementsData([]);

    renderNavBar();
    runAnimationSequence();
}

function runAnimationSequence() {
    let ancientIndex = 0;
    
    // Clear initial state
    displayedPaths = [];
    displayedMarkers = [];
    visitedCountries.clear();
    document.getElementById('leftTower').innerHTML = ''; 
    document.getElementById('rightTower').innerHTML = ''; 
    
    function playNextAncient() {
        if (ancientIndex < ancientSequence.length) {
            const step = ancientSequence[ancientIndex];
            addSegmentToGlobe(step);
            addJengaBlock(step, 'ancient'); 
            highlightNav('ancient', ancientIndex);
            
            ancientIndex++;
            animationTimeout = setTimeout(playNextAncient, 1000); 
        } else {
            setTimeout(startBRISequence, 1500);
        }
    }
    
    playNextAncient();
}

function startBRISequence() {
    let briIndex = 0;
    
    function playNextBRI() {
        if (briIndex < briSequence.length) {
            const step = briSequence[briIndex];
            addSegmentToGlobe(step);
            addJengaBlock(step, 'modern'); 
            highlightNav('modern', briIndex);
            
            briIndex++;
            animationTimeout = setTimeout(playNextBRI, 1000); 
        }
    }
    playNextBRI();
}

function addSegmentToGlobe(step) {
    if (step.countryName) {
        visitedCountries.add(step.countryName);
        globe.polygonsData(globe.polygonsData()); 
    }

    if (step.coords.length > 0) {
        displayedPaths.push({ coords: step.coords, color: step.color });
        const endCoord = step.coords[step.coords.length - 1];
        displayedMarkers.push({ lat: endCoord[0], lng: endCoord[1], color: step.color, label: step.label });
    } else if (step.id === 'taiwan') {
         displayedMarkers.push({ lat: 25.0, lng: 121.0, color: '#3b82f6', label: 'Origin' });
    } else if (step.id === 'start_bri') {
         displayedMarkers.push({ lat: 39.9, lng: 116.4, color: '#22c55e', label: 'Beijing' });
    }

    globe.pathsData([...displayedPaths]);
    globe.htmlElementsData([...displayedMarkers].map(p => createMarker(p)));
}

// --- JENGA UI LOGIC ---

function addJengaBlock(step, type) {
    // Select correct tower
    const containerId = type === 'ancient' ? 'leftTower' : 'rightTower';
    const container = document.getElementById(containerId);
    
    const block = document.createElement('div');
    block.className = `jenga-block ${type === 'ancient' ? 'block-ancient' : 'block-modern'}`;
    
    block.innerHTML = `
        <div class="block-header">
            <span class="block-name">${step.name}</span>
            <span class="block-year">${step.year}</span>
        </div>
        <div class="block-desc">${step.description}</div>
    `;
    
    container.appendChild(block);
    
    // Auto Scroll to bottom
    container.scrollTop = container.scrollHeight;
}

function jumpToStep(type, index) {
    clearTimeout(animationTimeout); 
    
    // Reset Everything
    displayedPaths = [];
    displayedMarkers = [];
    visitedCountries.clear();
    document.getElementById('leftTower').innerHTML = ''; 
    document.getElementById('rightTower').innerHTML = ''; 

    // 1. Process Ancient
    const ancientLimit = type === 'ancient' ? index : ancientSequence.length - 1;
    for (let i = 0; i <= ancientLimit; i++) {
        addSegmentToGlobe(ancientSequence[i]);
        addJengaBlock(ancientSequence[i], 'ancient');
    }
    
    // 2. Process Modern
    if (type === 'modern') {
        for (let i = 0; i <= index; i++) {
            addSegmentToGlobe(briSequence[i]);
            addJengaBlock(briSequence[i], 'modern');
        }
    }
    
    highlightNav(type, index);
}

function highlightNav(type, index) {
    document.querySelectorAll('.nav-pill').forEach(btn => btn.classList.remove('ancient-active', 'modern-active'));
    const btnId = `${type}-btn-${index}`;
    const btn = document.getElementById(btnId);
    if(btn) btn.classList.add(type === 'ancient' ? 'ancient-active' : 'modern-active');
}

function renderNavBar() {
    const ancientRow = document.getElementById('ancient-nav-row');
    const modernRow = document.getElementById('modern-nav-row');

    ancientSequence.forEach((step, index) => {
        const pill = document.createElement('div');
        pill.className = 'nav-pill ancient-pill';
        pill.innerText = step.label;
        pill.onclick = () => jumpToStep('ancient', index);
        pill.id = `ancient-btn-${index}`;
        ancientRow.appendChild(pill);
    });

    briSequence.forEach((step, index) => {
        const pill = document.createElement('div');
        pill.className = 'nav-pill modern-pill';
        pill.innerText = step.label;
        pill.onclick = () => jumpToStep('modern', index);
        pill.id = `modern-btn-${index}`;
        modernRow.appendChild(pill);
    });
}

function createMarker(d) {
    const el = document.createElement('div');
    el.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center;">
            <div style="width:12px; height:12px; background:${d.color}; border:2px solid white; border-radius:50%; box-shadow:0 0 15px ${d.color};"></div>
            <div style="background:rgba(0,0,0,0.6); color:white; padding:2px 6px; border-radius:4px; font-size:10px; margin-top:4px; white-space:nowrap; pointer-events:none;">${d.label}</div>
        </div>
    `;
    return el;
}

initGlobe();
</script>
</body>
</html>
