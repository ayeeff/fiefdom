<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austronesian & China Aid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    
    <style>
        #globeViz { 
            width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; 
            z-index: 1; background: #02040a;
        }
        .ui-panel {
            position: fixed; top: 20px; left: 20px; width: 320px;
            background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px;
            padding: 20px; z-index: 10; font-family: sans-serif; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .title { font-size: 1.2rem; font-weight: 800; color: #38bdf8; margin-bottom: 5px; }
        .desc { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
        
        .progress-bar {
            height: 4px; background: #334155; border-radius: 2px; margin-top: 15px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%; background: #38bdf8; transition: width 0.5s ease;
        }
        
        .step-label {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 10px 24px; border-radius: 30px;
            border: 1px solid #333; color: #fff; font-weight: bold; font-family: sans-serif;
            opacity: 0; transition: opacity 0.5s; z-index: 10;
        }

        .info-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
        }
        .info-title { font-weight: bold; color: #e2e8f0; margin-bottom: 5px; }
        .info-detail { font-size: 0.85rem; color: #94a3b8; margin-bottom: 3px; }
        .info-label { font-weight: 600; color: #cbd5e1; }
        
        .markers-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .marker-tag {
            padding: 4px 8px;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 4px;
            font-size: 0.75rem;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="ui-panel">
    <div class="title" id="panel-title">THE WOLF SCOUTS</div>
    <div class="desc" id="panel-desc">Tracing the path step-by-step.</div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="prog-bar"></div>
    </div>

    <div class="info-box" id="step-info">
        <div class="info-title" id="step-name"></div>
        <div class="info-detail"><span class="info-label">Year:</span> <span id="step-year"></span></div>
        <div class="info-detail"><span class="info-label">Description:</span> <span id="step-desc"></span></div>
        <div class="info-detail"><span class="info-label">Technology:</span> <span id="step-tech"></span></div>
        <div class="info-detail"><span class="info-label">Guidance:</span> <span id="step-guide"></span></div>
        <div class="markers-container" id="step-markers"></div>
    </div>
</div>

<div class="step-label" id="step-toast"></div>

<script>
let globe;
let animationInterval;
let currentPathData = [];
let currentPointsData = [];

// ==================== SEQUENTIAL DATA ====================

const ancientSequence = [
    {
        name: 'Taiwan → Luzon',
        coords: [[25.0, 121.0], [20.0, 121.5], [14.6, 121.0]],
        color: '#3b82f6',
        year: '~3000 BCE',
        description: 'First island hop across the Luzon Strait',
        tech: 'Early outrigger canoes, stone adzes',
        guide: 'Coastal landmarks, currents, swell patterns',
        markers: ['Fujian/Taiwan', 'Luzon']
    },
    {
        name: 'Luzon → Sulawesi',
        coords: [[14.6, 121.0], [10.0, 122.0], [5.0, 120.0], [-2.0, 120.3]],
        color: '#3b82f6',
        year: '~2500 BCE',
        description: 'Expansion into Indonesian archipelago',
        tech: 'Refined outriggers, sail technology improvements',
        guide: 'Stars (basic), cloud formations, bird migration',
        markers: ['Fujian/Taiwan', 'Luzon', 'Sulawesi']
    },
    {
        name: 'Sulawesi → Fiji',
        coords: [[-2.0, 120.3], [-5.0, 130.0], [-10.0, 145.0], [-15.0, 165.0], [-17.7, 178.1]],
        color: '#3b82f6',
        year: '~1500 BCE',
        description: 'Great leap across open Pacific to Melanesia',
        tech: 'Double-hulled canoes, Lapita pottery',
        guide: 'Advanced star compass, deep ocean swell reading',
        markers: ['Fujian/Taiwan', 'Luzon', 'Sulawesi', 'Fiji']
    },
    {
        name: 'Fiji → Tonga → Samoa',
        coords: [[-17.7, 178.1], [-19.0, -178.0], [-21.2, -175.2], [-18.0, -174.0], [-13.8, -172.1]],
        color: '#3b82f6',
        year: '~1200 BCE',
        description: 'Polynesian heartland established',
        tech: 'Specialized voyaging canoes, horticultural tools',
        guide: 'Zenith stars, latitude sailing, oral traditions',
        markers: ['Fujian/Taiwan', 'Luzon', 'Sulawesi', 'Fiji', 'Tonga', 'Samoa']
    },
    {
        name: 'Samoa → Hawai\'i',
        coords: [[-13.8, -172.1], [-5.0, -165.0], [5.0, -160.0], [15.0, -157.0], [21.3, -157.8]],
        color: '#3b82f6',
        year: '~500 CE',
        description: 'Northern voyages to Hawaiian islands',
        tech: 'Large double-hulled voyaging canoes (wa\'a kaulua)',
        guide: 'Celestial navigation, ocean currents, wind patterns',
        markers: ['Fujian/Taiwan', 'Luzon', 'Sulawesi', 'Fiji', 'Tonga', 'Samoa', 'Hawai\'i']
    },
    {
        name: 'Samoa → Aotearoa',
        coords: [[-13.8, -172.1], [10.0, -165.0], [-10.0, 175.0], [-30.0, 175.0], [-41.3, 174.8]],
        color: '#3b82f6',
        year: '~800 CE',
        description: 'Settlement of New Zealand (Aotearoa)',
        tech: 'Reinforced voyaging canoes for colder, rougher seas',
        guide: 'Southern star paths, migrating whales, long-distance swell',
        markers: ['Fujian/Taiwan', 'Luzon', 'Sulawesi', 'Fiji', 'Tonga', 'Samoa', 'Hawai\'i', 'Aotearoa']
    }
];

const briSequence = [
    {
        name: 'China → Tonga',
        coords: [[25.0, 121.0], [10.0, 150.0], [-5.0, 170.0], [-21.2, -175.2]],
        color: '#22c55e',
        year: '2019',
        description: 'Courthouse construction & development loans',
        tech: 'Modern cargo ships, construction machinery',
        guide: 'GPS, satellite navigation, digital charts',
        markers: ['China', 'Tonga']
    },
    {
        name: 'Tonga → Samoa',
        coords: [[-21.2, -175.2], [-18.0, -174.0], [-13.8, -172.1]],
        color: '#22c55e',
        year: '2021',
        description: 'Police academy construction',
        tech: 'Container ships, specialized construction equipment',
        guide: 'GPS, AIS (Automatic Identification System)',
        markers: ['China', 'Tonga', 'Samoa']
    },
    {
        name: 'Samoa → Solomon Islands',
        coords: [[-13.8, -172.1], [-10.0, -165.0], [-5.0, 160.0], [-9.4, 159.9]],
        color: '#22c55e',
        year: '2023',
        description: 'Major wharf construction project',
        tech: 'Dredging vessels, heavy lift ships',
        guide: 'GPS, hydrographic surveys',
        markers: ['China', 'Tonga', 'Samoa', 'Solomon Islands']
    },
    {
        name: 'Solomon Islands → Kiribati',
        coords: [[-9.4, 159.9], [-5.0, 165.0], [0.0, 170.0], [1.4, 173.0]],
        color: '#22c55e',
        year: '2023',
        description: 'Fisheries pier development',
        tech: 'Construction barges, pile drivers',
        guide: 'GPS, satellite imagery',
        markers: ['China', 'Tonga', 'Samoa', 'Solomon Islands', 'Kiribati']
    },
    {
        name: 'Kiribati → Fiji',
        coords: [[1.4, 173.0], [-5.0, 175.0], [-12.0, 178.0], [-17.7, 178.1]],
        color: '#22c55e',
        year: '2023',
        description: 'Hydropower, roads & "Great Wall" cricket stadium',
        tech: 'Bulk carriers (for materials), engineering teams',
        guide: 'GPS, project management software',
        markers: ['China', 'Tonga', 'Samoa', 'Solomon Islands', 'Kiribati', 'Fiji']
    }
];

// ==================== INITIALIZATION ====================

async function initGlobe() {
    const resp = await fetch('https://unpkg.com/world-atlas/countries-110m.json');
    const topo = await resp.json();
    const countries = topojson.feature(topo, topo.objects.countries).features;

    globe = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pointOfView({ lat: 5, lng: 165, altitude: 2.2 })
        .polygonsData(countries)
        .polygonCapColor(() => 'rgba(30, 41, 59, 0.4)')
        .polygonSideColor(() => 'rgba(0,0,0,0.2)')
        .polygonStrokeColor(() => '#111')
        .pathPoints('coords')
        .pathPointLat(p => p[0])
        .pathPointLng(p => p[1])
        .pathColor(d => d.color)
        .pathStroke(3)
        .pathDashLength(0.5)
        .pathDashGap(0.1)
        .pathDashAnimateTime(2000)
        .htmlElementsData([])
        .htmlElement(d => {
            const el = document.createElement('div');
            el.innerHTML = `
                <div style="width:14px; height:14px; background:${d.color}; border:2px solid white; border-radius:50%; box-shadow:0 0 10px ${d.color};"></div>
                <div style="color:${d.color}; font-family:sans-serif; font-weight:bold; font-size:12px; margin-top:4px; text-shadow:0 2px 4px black; white-space:nowrap;">${d.name}</div>
            `;
            return el;
        });

    startAnimation();
}

// ==================== ANIMATION ENGINE ====================

function startAnimation() {
    if (animationInterval) clearInterval(animationInterval);
    
    // --- Ancient Sequence ---
    document.getElementById('panel-title').innerText = "THE WOLF SCOUTS DEPART";
    document.getElementById('panel-title').style.color = '#38bdf8';
    document.getElementById('panel-desc').innerText = "Step-by-step migration from Taiwan to Aotearoa.";
    document.getElementById('prog-bar').style.backgroundColor = '#38bdf8';

    let stepIndex = 0;

    // Function to play a single sequence
    function playSequence(sequence, onComplete) {
        if (stepIndex >= sequence.length) {
            clearInterval(animationInterval);
            if (onComplete) onComplete();
            return;
        }

        addStep(sequence, stepIndex);
        stepIndex++;
        
        const pct = (stepIndex / sequence.length) * 100;
        document.getElementById('prog-bar').style.width = pct + '%';
    }

    // Start Ancient Sequence
    playSequence(ancientSequence, () => {
        // On Complete, wait 1 second then start Modern
        setTimeout(() => {
            // --- Modern Sequence ---
            document.getElementById('panel-title').innerText = "THE REUNION TOUR";
            document.getElementById('panel-title').style.color = '#22c55e';
            document.getElementById('panel-desc').innerText = "China's infrastructure path through the Pacific (2019-2024).";
            document.getElementById('prog-bar').style.backgroundColor = '#22c55e';
            document.getElementById('prog-bar').style.width = '0%';
            stepIndex = 0; // Reset index for new sequence
            
            // Start Modern Sequence
            animationInterval = setInterval(() => {
                playSequence(briSequence, () => {
                     showToast("All Sequences Complete");
                });
            }, 2000);
             playSequence(briSequence, () => {
                     showToast("All Sequences Complete");
                });

        }, 1000); // Wait 1 second
    });

    animationInterval = setInterval(() => {
        playSequence(ancientSequence, () => {
             // This callback is handled above
        });
    }, 2000);
}


function addStep(sequence, index) {
    const step = sequence[index];
    
    showToast(`Step ${index + 1}: ${step.name}`);

    // Update Info Box
    document.getElementById('step-name').innerText = step.name;
    document.getElementById('step-year').innerText = step.year;
    document.getElementById('step-desc').innerText = step.description;
    document.getElementById('step-tech').innerText = step.tech;
    document.getElementById('step-guide').innerText = step.guide;
    
    const markersContainer = document.getElementById('step-markers');
    markersContainer.innerHTML = '';
    step.markers.forEach(marker => {
        const tag = document.createElement('span');
        tag.className = 'marker-tag';
        tag.innerText = marker;
        markersContainer.appendChild(tag);
    });


    // Add Point (using last coord of the path)
    const lastCoord = step.coords[step.coords.length - 1];
    // Extract name from marker list roughly
    let locationName = step.markers[step.markers.length - 1];

    currentPointsData.push({
        lat: lastCoord[0],
        lng: lastCoord[1],
        name: locationName,
        color: step.color
    });
    globe.htmlElementsData(currentPointsData);

    // Add Path
    currentPathData.push({
        coords: step.coords,
        color: step.color
    });
    globe.pathsData(currentPathData);
}

function showToast(text) {
    const el = document.getElementById('step-toast');
    el.innerText = text;
    el.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; }, 1800);
}

initGlobe();
</script>
</body>
</html>
