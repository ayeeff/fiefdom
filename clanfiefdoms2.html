<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese EV War: Clans & Fiefdoms</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-sankey/0.12.3/d3-sankey.min.js"></script>
    <style>body{margin:0;padding:0;background-color:#1a1a1a;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{width:100%;padding:15px 0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#1a1a1a;border-bottom:1px solid #333}h1{margin:0;font-size:1.8rem;letter-spacing:1px}p{margin:5px 0 0;font-size:1rem;color:#aaa}#main-container{display:flex;flex-direction:row;width:95%;max-width:1600px;margin-top:20px;align-items:flex-start;justify-content:center}#chart{flex:3;display:flex;justify-content:center;align-items:center;min-width:800px;min-height:700px}#sidebar{flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,0.05);border-left:1px solid #333;overflow-y:auto;padding:10px 0;border-radius:8px;margin-left:20px;max-width:350px}#legend{padding:15px}.legend-clan-header{font-weight:bold;margin-top:20px;margin-bottom:10px;color:#fff;text-transform:uppercase;font-size:1rem;border-bottom:2px solid #555;padding-bottom:5px}.legend-item{display:flex;align-items:center;margin-bottom:6px}.legend-color{width:14px;height:14px;border-radius:3px;margin-right:10px;flex-shrink:0}.legend-label{font-size:0.95rem;color:#ddd}#data-table-container{width:95%;max-width:1600px;margin:40px auto;padding:20px;background:rgba(255,255,255,0.05);border-radius:8px}h2{font-size:1.2rem;margin-top:0;margin-bottom:15px;color:#eee;border-bottom:1px solid #444;padding-bottom:5px}table{width:100%;border-collapse:collapse;font-size:0.95rem}th,td{text-align:left;padding:10px;border-bottom:1px solid #333}th{background-color:rgba(255,255,255,0.07);color:#aaa;font-weight:600}td{color:#ccc}tr:hover{background-color:rgba(255,255,255,0.05)}svg text{fill:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:12px;font-weight:500}.tooltip{position:absolute;background:rgba(0,0,0,0.95);border:1px solid #555;box-shadow:0 4px 6px rgba(0,0,0,0.3);border-radius:4px;color:#fff;padding:12px;font-family:'Segoe UI',sans-serif;font-size:0.9rem;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:1000}#sidebar::-webkit-scrollbar{width:8px}#sidebar::-webkit-scrollbar-track{background:#1a1a1a}#sidebar::-webkit-scrollbar-thumb{background:#555;border-radius:4px}.node rect{stroke:#1a1a1a;stroke-width:2}.link{fill:none;stroke-opacity:0.3}.link:hover{stroke-opacity:0.6}</style>
</head>
<body>
    <header>
        <h1>The Chinese EV OS "Civil War"</h1>
        <p>Flow: Tech Clan → Fiefdom → OS Layer → Car Brands</p>
    </header>
    <div id="main-container">
        <div id="chart"></div>
        <div id="sidebar"><div id="legend"></div></div>
    </div>
    <div id="data-table-container">
        <h2>The Clans & Fiefdoms of Chinese Auto (Full List)</h2>
        <table id="ev-table">            <thead><tr><th>Clan</th><th>Fiefdom</th><th>OS Name</th><th>Brands</th></tr></thead><tbody></tbody></table>
    </div>
    <script>const clanColors={"Huawei HarmonyOS":"#C9171E","Android Skins":"#00695C","Geely (Meizu)":"#0066CC","Xiaomi HyperOS":"#FF6900","NIO SkyOS":"#9C27B0"};const fiefdomColors={"HIMA Alliance":"#E53935","Huawei Inside Partners":"#D32F2F","Xiaomi Auto":"#FF8A50","NIO Inc.":"#AB47BC","Flyme Auto Core":"#1976D2","Flyme":"#42A5F5","BYD Group":"#388E3C","XPeng":"#00897B","Li Auto (Fiefdom)":"#00ACC1","SAIC Group":"#0097A7","GAC Group":"#00BCD4","GWM":"#4DD0E1","Leapmotor (Fiefdom)":"#80DEEA"};const osColors={"HarmonyOS":"#FF4444","HyperOS":"#FFA726","SkyOS":"#BA68C8","Flyme Auto":"#42A5F5","ZEEKR OS":"#29B6F6","Lotus Hyper OS":"#4FC3F7","DiLink":"#66BB6A","Xmart OS":"#26A69A","Li OS":"#26C6DA","Leapmotor OS":"#80DEEA","Coffee OS":"#4DD0E1","ADiGO OS":"#4DD0E1","IM OS":"#00ACC1"};const rawData=[{clan:"Huawei HarmonyOS",fiefdom:"HIMA Alliance",os:"HarmonyOS",brands:[{name:"AITO",value:40},{name:"Luxeed",value:20},{name:"Stelato",value:15},{name:"Maextro",value:10}]},{clan:"Huawei HarmonyOS",fiefdom:"Huawei Inside Partners",os:"HarmonyOS",brands:[{name:"Avatr",value:20},{name:"Arcfox",value:15},{name:"Voyah",value:15}]},{clan:"Xiaomi HyperOS",fiefdom:"Xiaomi Auto",os:"HyperOS",brands:[{name:"Xiaomi SU7",value:40}]},{clan:"NIO SkyOS",fiefdom:"NIO Inc.",os:"SkyOS",brands:[{name:"NIO (Brand)",value:40},{name:"Onvo",value:20},{name:"Firefly",value:15}]},{clan:"Geely (Meizu)",fiefdom:"Flyme Auto Core",os:"Flyme Auto",brands:[{name:"Geely Galaxy",value:25},{name:"Lynk & Co",value:20},{name:"Polestar",value:10}]},{clan:"Geely (Meizu)",fiefdom:"Flyme",os:"ZEEKR OS",brands:[{name:"Zeekr",value:35}]},{clan:"Geely (Meizu)",fiefdom:"Flyme",os:"Lotus Hyper OS",brands:[{name:"Lotus",value:10}]},{clan:"Android Skins",fiefdom:"BYD Group",os:"DiLink",brands:[{name:"BYD (Brand)",value:80},{name:"Yangwang",value:10},{name:"Fang Cheng Bao",value:10}]},{clan:"Android Skins",fiefdom:"XPeng",os:"Xmart OS",brands:[{name:"XPeng (Brand)",value:30},{name:"Mona",value:15}]},{clan:"Android Skins",fiefdom:"Li Auto (Fiefdom)",os:"Li OS",brands:[{name:"Li Auto (Brand)",value:40}]},{clan:"Android Skins",fiefdom:"SAIC Group",os:"IM OS",brands:[{name:"IM Motors",value:15},{name:"MG",value:25},{name:"Rising Auto",value:10}]},{clan:"Android Skins",fiefdom:"GAC Group",os:"ADiGO OS",brands:[{name:"Aion",value:35},{name:"Hyper",value:10}]},{clan:"Android Skins",fiefdom:"GWM",os:"Coffee OS",brands:[{name:"Ora",value:15},{name:"Wey",value:10},{name:"Tank",value:15}]},{clan:"Android Skins",fiefdom:"Leapmotor (Fiefdom)",os:"Leapmotor OS",brands:[{name:"Leapmotor (Brand)",value:20}]}];const nodes=[];const links=[];let nodeIndex=0;rawData.forEach(d=>{if(!nodes.find(n=>n.name===d.clan)){nodes.push({name:d.clan,type:'clan',color:clanColors[d.clan],id:nodeIndex++})}});rawData.forEach(d=>{if(!nodes.find(n=>n.name===d.fiefdom)){nodes.push({name:d.fiefdom,type:'fiefdom',color:fiefdomColors[d.fiefdom],id:nodeIndex++})}});rawData.forEach(d=>{const osKey=d.os+'_'+d.fiefdom;if(!nodes.find(n=>n.name===d.os&&n.fiefdomKey===osKey)){nodes.push({name:d.os,type:'os',color:osColors[d.os]||fiefdomColors[d.fiefdom],id:nodeIndex++,fiefdomKey:osKey})}});rawData.forEach(d=>{d.brands.forEach(brand=>{if(!nodes.find(n=>n.name===brand.name)){nodes.push({name:brand.name,type:'brand',color:osColors[d.os]||fiefdomColors[d.fiefdom],id:nodeIndex++})}})});rawData.forEach(d=>{const clanNode=nodes.find(n=>n.name===d.clan);const fiefdomNode=nodes.find(n=>n.name===d.fiefdom);const fiefdomTotal=d.brands.reduce((sum,b)=>sum+b.value,0);links.push({source:clanNode.id,target:fiefdomNode.id,value:fiefdomTotal,color:fiefdomColors[d.fiefdom]});const osKey=d.os+'_'+d.fiefdom;const osNode=nodes.find(n=>n.name===d.os&&n.fiefdomKey===osKey);links.push({source:fiefdomNode.id,target:osNode.id,value:fiefdomTotal,color:osColors[d.os]||fiefdomColors[d.fiefdom]});d.brands.forEach(brand=>{const brandNode=nodes.find(n=>n.name===brand.name);links.push({source:osNode.id,target:brandNode.id,value:brand.value,color:osColors[d.os]||fiefdomColors[d.fiefdom]})})});const width=1200;const height=900;const margin={top:20,right:180,bottom:20,left:180};const svg=d3.select('#chart').append('svg').attr('width',width).attr('height',height).attr('viewBox',`0 0 ${width} ${height}`).style('max-width','100%').style('height','auto');const tooltip=d3.select('body').append('div').attr('class','tooltip');const sankey=d3.sankey().nodeId(d=>d.id).nodeWidth(15).nodePadding(8).extent([[margin.left,margin.top],[width-margin.right,height-margin.bottom]]);const graph=sankey({nodes:nodes.map(d=>Object.assign({},d)),links:links.map(d=>Object.assign({},d))});const link=svg.append('g').selectAll('.link').data(graph.links).join('path').attr('class','link').attr('d',d3.sankeyLinkHorizontal()).attr('stroke',d=>d.color).attr('stroke-width',d=>Math.max(1,d.width)).on('mouseover',function(event,d){d3.select(this).style('stroke-opacity',0.6);tooltip.transition().duration(200).style('opacity',1);tooltip.html(`<strong>${d.source.name} → ${d.target.name}</strong><br/>Flow: ${d.value}`).style('left',(event.pageX+10)+'px').style('top',(event.pageY-28)+'px')}).on('mouseout',function(){d3.select(this).style('stroke-opacity',0.3);tooltip.transition().duration(500).style('opacity',0)});const node=svg.append('g').selectAll('.node').data(graph.nodes).join('g').attr('class','node');node.append('rect').attr('x',d=>d.x0).attr('y',d=>d.y0).attr('height',d=>d.y1-d.y0).attr('width',d=>d.x1-d.x0).attr('fill',d=>d.color).on('mouseover',function(event,d){d3.select(this).attr('opacity',0.8);tooltip.transition().duration(200).style('opacity',1);tooltip.html(`<strong>${d.name}</strong><br/>Type: ${d.type}<br/>Value: ${d.value}`).style('left',(event.pageX+10)+'px').style('top',(event.pageY-28)+'px')}).on('mouseout',function(){d3.select(this).attr('opacity',1);tooltip.transition().duration(500).style('opacity',0)});node.append('text').attr('x',d=>d.x0<width/2?d.x1+6:d.x0-6).attr('y',d=>(d.y1+d.y0)/2).attr('dy','0.35em').attr('text-anchor',d=>d.x0<width/2?'start':'end').text(d=>d.name).style('font-size','10px');const legendContainer=document.getElementById('legend');const tableBody=document.querySelector('#ev-table tbody');const clanMap={};rawData.forEach(d=>{if(!clanMap[d.clan]){clanMap[d.clan]=[]}if(!clanMap[d.clan].find(f=>f.fiefdom===d.fiefdom&&f.os===d.os)){clanMap[d.clan].push(d)}else{const existing=clanMap[d.clan].find(f=>f.fiefdom===d.fiefdom&&f.os===d.os);existing.brands.push(...d.brands)}});Object.keys(clanMap).forEach(clan=>{const clanHeader=document.createElement('div');clanHeader.className='legend-clan-header';clanHeader.style.borderColor=clanColors[clan];clanHeader.textContent=clan;legendContainer.appendChild(clanHeader);clanMap[clan].forEach(fiefdom=>{const item=document.createElement('div');item.className='legend-item';const colorBox=document.createElement('div');colorBox.className='legend-color';colorBox.style.backgroundColor=osColors[fiefdom.os]||fiefdomColors[fiefdom.fiefdom];const label=document.createElement('span');label.className='legend-label';label.textContent=fiefdom.fiefdom.replace(' (Fiefdom)','')+' → '+fiefdom.os;item.appendChild(colorBox);item.appendChild(label);legendContainer.appendChild(item);const tr=document.createElement('tr');const tdClan=document.createElement('td');tdClan.textContent=clan;tdClan.style.color=clanColors[clan];const tdFiefdom=document.createElement('td');tdFiefdom.textContent=fiefdom.fiefdom.replace(' (Fiefdom)','');const tdOS=document.createElement('td');tdOS.textContent=fiefdom.os;tdOS.style.color=osColors[fiefdom.os]||'#aaa';const tdBrands=document.createElement('td');const brandsList=fiefdom.brands.map(c=>c.name.replace(' (Brand)','')).join(", ");tdBrands.textContent=brandsList;tdBrands.style.color="#888";tr.appendChild(tdClan);tr.appendChild(tdFiefdom);tr.appendChild(tdOS);tr.appendChild(tdBrands);tableBody.appendChild(tr)})});</script>
</body>
</html>
