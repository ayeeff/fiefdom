<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Strategic Oil Reserves 3D Globe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000003; color: white; overflow: hidden; }
        
        #container { display: flex; height: 100vh; width: 100vw; }
        
        #sidebar {
            width: 320px;
            background: rgba(0,0,0,0.95);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            z-index: 100;
            flex-shrink: 0; /* Prevent sidebar shrinking */
        }
        #sidebar h2 { color: #ffaa00; font-size: 18px; margin-bottom: 10px; }
        #sidebar p { color: #999; font-size: 12px; margin-bottom: 15px; }
        
        .legend {
            background: rgba(139,69,19,0.2);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .gradient-bar {
            height: 10px;
            background: linear-gradient(to right, white, #8B4513);
            margin: 5px 0;
            border-radius: 2px;
        }
        .gradient-labels { display: flex; justify-content: space-between; font-size: 10px; }
        
        .country-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-left: 4px solid #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .country-item:hover { background: rgba(255,170,0,0.15); }
        .country-item.selected { background: rgba(255,170,0,0.2); border-left-color: #ffaa00; }
        
        .country-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .country-name { font-weight: bold; font-size: 13px; }
        .country-inventory { color: #ffaa00; font-size: 12px; }
        .country-details { font-size: 11px; color: #aaa; display: flex; justify-content: space-between; }
        
        #globe-container { flex: 1; position: relative; height: 100%; width: 100%; }
        
        .info-box {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 4px;
            max-width: 250px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .info-box h3 { color: #ffaa00; margin: 0 0 10px 0; }
        .info-box p { color: #ccc; line-height: 1.5; }
        
        #detail-panel {
            position: absolute;
            bottom: 20px; left: 20px; right: 20px;
            margin: auto;
            width: fit-content;
            min-width: 300px;
            max-width: 500px;
            background: rgba(0,0,0,0.95);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ff8800;
            display: none;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #detail-panel h3 { color: #ff8800; font-size: 18px; margin-bottom: 15px; }
        .detail-row {
            display: flex; justify-content: space-between;
            margin: 8px 0; padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .detail-label { color: #aaa; font-size: 13px; }
        .detail-value { color: #fff; font-weight: bold; font-size: 13px; }
        .notes { margin-top: 15px; padding: 10px; background: rgba(255,136,0,0.1); border-radius: 4px; font-size: 12px; line-height: 1.5; color: #ddd; }
        
        .close-btn {
            position: absolute; top: 15px; right: 15px;
            background: #ff8800; border: none; color: white;
            padding: 5px 12px; border-radius: 4px;
            cursor: pointer; font-size: 12px;
        }
        .close-btn:hover { background: #ff6600; }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h2>Top 20 Oil Reserves</h2>
            <p>Select a country to view details</p>
            
            <div class="legend">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span>Days Cover:</span>
                </div>
                <div class="gradient-bar"></div>
                <div class="gradient-labels">
                    <span>Low</span>
                    <span>High</span>
                </div>
            </div>
            <div id="country-list"></div>
        </div>

        <div id="globe-container">
            <div class="info-box">
                <h3>Strategic Oil Reserves 2025</h3>
                <p>
                    <strong>Choropleth:</strong> Days Net-Import Cover<br>
                    <strong>Orange rings:</strong> Each ring = 100 Mb inventory<br>
                    <strong>Points:</strong> Storage locations
                </p>
            </div>
            
            <div id="detail-panel">
                <button class="close-btn" onclick="closeDetailPanel()">✕ Close</button>
                <h3 id="detail-title"></h3>
                <div class="detail-row"><span class="detail-label">Rank</span><span class="detail-value" id="detail-rank"></span></div>
                <div class="detail-row"><span class="detail-label">Total Tankage</span><span class="detail-value" id="detail-tankage"></span></div>
                <div class="detail-row"><span class="detail-label">Current Inventory</span><span class="detail-value" id="detail-inventory"></span></div>
                <div class="detail-row"><span class="detail-label">Days Cover</span><span class="detail-value" id="detail-days"></span></div>
                <div class="notes"><strong>Notes:</strong><br><span id="detail-notes"></span></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/globe.gl@2.35.2/dist/globe.gl.min.js"></script>
    
    <script>
        // Safety check to see if library loaded
        if (typeof Globe === 'undefined') {
            alert("Error: The globe.gl library failed to load.\n\nMake sure you have an internet connection. If you are opening this file directly from your computer, ensure your browser allows loading scripts from remote URLs.");
        }

        const countries = [
            { name: "China", lat: 35.8617, lng: 104.1954, tankage: 2000, inventory: 1300, days: 120, notes: "70% import dependent; 11 Mb/d imports; tanks still only ~60% full" },
            { name: "United States", lat: 37.0902, lng: -95.7129, tankage: 714, inventory: 411, days: 125, notes: "12 Mb/d net imports; draw-down max 4.4 Mb/d" },
            { name: "Japan", lat: 36.2048, lng: 138.2529, tankage: 590, inventory: 500, days: 240, notes: "IEA obligation 90-days; industry + state tanks; 3.3 Mb/d net imports" },
            { name: "South Korea", lat: 35.9078, lng: 127.7669, tankage: 286, inventory: 240, days: 200, notes: "Mandatory industry stocks 40-60 days; 2.6 Mb/d imports" },
            { name: "Germany", lat: 51.1657, lng: 10.4515, tankage: 250, inventory: 250, days: 140, notes: "EBV caverns + industry; 90-days EU rule" },
            { name: "Spain", lat: 40.4637, lng: -3.7492, tankage: 144, inventory: 144, days: 130, notes: "EU 90-day rule; largely above-ground tanks" },
            { name: "India", lat: 20.5937, lng: 78.9629, tankage: 130, inventory: 75, days: 90, notes: "5.2 Mb/d imports; 3 new 6.5 Mb sites under construction" },
            { name: "France", lat: 46.2276, lng: 2.2137, tankage: 65, inventory: 65, days: 95, notes: "SAGESS + industry; 90-day EU obligation" },
            { name: "Singapore", lat: 1.3521, lng: 103.8198, tankage: 55, inventory: 55, days: 170, notes: "Trading hub; 32 Mb crude + 23 Mb products" },
            { name: "Finland", lat: 61.9241, lng: 25.7482, tankage: 62, inventory: 62, days: 150, notes: "Baltic pipeline disruption hedge" },
            { name: "Italy", lat: 41.8719, lng: 12.5674, tankage: 60, inventory: 60, days: 100, notes: "EU 90-day floor; mostly coastal tanks" },
            { name: "Netherlands", lat: 52.1326, lng: 5.2913, tankage: 55, inventory: 55, days: 95, notes: "Rotterdam-Antwerp ARA hub stocks" },
            { name: "Poland", lat: 51.9194, lng: 19.1451, tankage: 50, inventory: 50, days: 110, notes: "PERN + EU obligation; new Baltic Pipe" },
            { name: "Canada", lat: 56.1304, lng: -106.3468, tankage: 45, inventory: 45, days: 60, notes: "Net exporter; stocks held for U.S. Midwest refiners" },
            { name: "South Africa", lat: -30.5595, lng: 22.9375, tankage: 45, inventory: 45, days: 90, notes: "Saldanha Bay underground; 0.5 Mb/d imports" },
            { name: "Turkey", lat: 38.9637, lng: 35.2433, tankage: 40, inventory: 40, days: 85, notes: "BOTAS + EU-aligned rules" },
            { name: "Sweden", lat: 60.1282, lng: 18.6435, tankage: 35, inventory: 35, days: 110, notes: "Coastal product caverns" },
            { name: "Belgium", lat: 50.5039, lng: 4.4699, tankage: 34, inventory: 34, days: 95, notes: "ARA trading hub" },
            { name: "Israel", lat: 31.0461, lng: 34.8516, tankage: 30, inventory: 30, days: 270, notes: "Consumption-only rule; 0.25 Mb/d demand" },
            { name: "Taiwan", lat: 23.6978, lng: 120.9605, tankage: 27, inventory: 27, days: 120, notes: "0.9 Mb/d imports; 30-day commercial mandate" }
        ];

        let selectedCountry = null;
        let globe = null;

        function closeDetailPanel() {
            document.getElementById('detail-panel').style.display = 'none';
            if (globe) globe.controls().autoRotate = true;
        }

        function showDetailPanel(country) {
            if(!country) return;
            const rank = countries.findIndex(c => c.name === country.name) + 1;
            document.getElementById('detail-title').textContent = country.name;
            document.getElementById('detail-rank').textContent = `#${rank}`;
            document.getElementById('detail-tankage').textContent = `${country.tankage} Mb`;
            document.getElementById('detail-inventory').textContent = `${country.inventory} Mb`;
            document.getElementById('detail-days').textContent = `${country.days} days`;
            document.getElementById('detail-notes').textContent = country.notes;
            document.getElementById('detail-panel').style.display = 'block';
        }

        function focusOnCountry(country) {
            selectedCountry = country.name;
            document.querySelectorAll('.country-item').forEach(item => {
                item.classList.toggle('selected', item.dataset.country === country.name);
            });
            if (globe) {
                globe.pointOfView({ lat: country.lat, lng: country.lng, altitude: 1.5 }, 1000);
                globe.controls().autoRotate = false;
            }
            showDetailPanel(country);
        }

        const countryList = document.getElementById('country-list');
        countries.forEach((country, idx) => {
            const item = document.createElement('div');
            item.className = 'country-item';
            item.dataset.country = country.name;
            item.innerHTML = `
                <div class="country-header">
                    <span class="country-name">${idx + 1}. ${country.name}</span>
                    <span class="country-inventory">${country.inventory} Mb</span>
                </div>
                <div class="country-details"><span>Tankage: ${country.tankage} Mb</span><span>Days: ${country.days}</span></div>
            `;
            item.addEventListener('click', () => focusOnCountry(country));
            countryList.appendChild(item);
        });

        // Generate Ring Data
        const ringData = [];
        countries.forEach(country => {
            const fullCircles = Math.floor(country.inventory / 100);
            const partialCircle = (country.inventory % 100) / 100;
            for (let i = 0; i < fullCircles; i++) {
                ringData.push({
                    lat: country.lat, lng: country.lng, name: country.name,
                    altitude: 0.02 + (i * 0.015), size: 0.8, isFull: true
                });
            }
            if (partialCircle > 0) {
                ringData.push({
                    lat: country.lat, lng: country.lng, name: country.name,
                    altitude: 0.02 + (fullCircles * 0.015), size: 0.8, isFull: false, fillRatio: partialCircle
                });
            }
        });

        // Initialize Globe
        const globeContainer = document.getElementById('globe-container');
        
        try {
            globe = Globe()
                (globeContainer)
                .width(globeContainer.clientWidth)
                .height(globeContainer.clientHeight)
                .backgroundColor('#000003')
                // Force HTTPS for image
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
                .atmosphereColor('#4488ff')
                .atmosphereAltitude(0.15)
                .hexPolygonsData(countries)
                .hexPolygonResolution(3)
                .hexPolygonMargin(0.3)
                .hexPolygonColor(d => {
                    const normalized = Math.min(d.days / 270, 1);
                    const r = Math.floor(139 * normalized + 255 * (1 - normalized));
                    const g = Math.floor(69 * normalized + 255 * (1 - normalized));
                    const b = Math.floor(19 * normalized + 255 * (1 - normalized));
                    return `rgba(${r}, ${g}, ${b}, 0.7)`;
                })
                .hexPolygonLabel(d => `
                    <div style="background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px; color: white;">
                        <b>${d.name}</b><br/>Days Cover: ${d.days}
                    </div>
                `)
                .ringsData(ringData)
                .ringLat('lat')
                .ringLng('lng')
                .ringMaxRadius('size')
                .ringPropagationSpeed(0)
                .ringRepeatPeriod(0)
                .ringAltitude('altitude')
                .ringColor(d => d.isFull ? '#ff8800' : `rgba(255, 136, 0, ${d.fillRatio})`)
                .onRingClick(d => {
                    if (d && d.name) {
                        const country = countries.find(c => c.name === d.name);
                        if (country) focusOnCountry(country);
                    }
                })
                .pointsData(countries)
                .pointAltitude(0.01)
                .pointRadius(0.3)
                .pointColor(() => '#ffcc00')
                .pointLabel(d => `
                    <div style="background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px; color: white;">
                        <b>${d.name}</b><br/>Inventory: ${d.inventory} Mb
                    </div>
                `);

            globe.controls().autoRotate = true;
            globe.controls().autoRotateSpeed = 0.5;
        } catch (error) {
            console.error("Globe initialization failed:", error);
        }

        window.addEventListener('resize', () => {
            if(globe) {
                globe.width(globeContainer.clientWidth);
                globe.height(globeContainer.clientHeight);
            }
        });
    </script>
</body>
</html>
