<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Strategic Oil Reserves 3D Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #000003;
            color: white;
            overflow: hidden;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 320px;
            background: rgba(0,0,0,0.95);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            z-index: 10000;
            position: relative;
        }
        #sidebar h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ffaa00;
        }
        #sidebar p {
            font-size: 12px;
            color: #999;
            margin: 0 0 15px 0;
        }
        .legend {
            font-size: 11px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(139,69,19,0.2);
            border-radius: 4px;
        }
        .gradient-bar {
            height: 10px;
            background: linear-gradient(to right, white, #8B4513);
            margin: 5px 0;
        }
        .gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-top: 2px;
        }
        .country-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-left: 4px solid #333;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
        }
        .country-item:hover {
            background: rgba(255,170,0,0.15);
        }
        .country-item.selected {
            background: rgba(255,170,0,0.2);
            border-left-color: #ffaa00;
        }
        .country-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .country-name {
            font-weight: bold;
            font-size: 13px;
        }
        .country-inventory {
            color: #ffaa00;
            font-size: 12px;
        }
        .country-details {
            font-size: 11px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        #globe-container {
            flex: 1;
            position: relative;
        }
        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 4px;
            max-width: 250px;
            font-size: 12px;
            z-index: 1000;
        }
        .info-box h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #ffaa00;
        }
        .info-box p {
            margin: 5px 0;
            line-height: 1.5;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h2>Top 20 Oil Reserves</h2>
            <p>Click to focus on globe</p>
            
            <div class="legend">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span>Days Cover:</span>
                </div>
                <div class="gradient-bar"></div>
                <div class="gradient-labels">
                    <span>Low</span>
                    <span>High</span>
                </div>
            </div>

            <div id="country-list"></div>
        </div>

        <div id="globe-container">
            <div class="info-box">
                <h3>Strategic Oil Reserves 2025</h3>
                <p>
                    <strong>Choropleth:</strong> Days Net-Import Cover<br>
                    <strong>Orange rings:</strong> Each ring = 100 Mb inventory<br>
                    <strong>Points:</strong> Storage locations
                </p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/globe.gl@2.31.0/dist/globe.gl.min.js"></script>
    <script>
        const countries = [
            { name: "China", lat: 35.8617, lng: 104.1954, tankage: 2000, inventory: 1300, days: 120 },
            { name: "United States", lat: 37.0902, lng: -95.7129, tankage: 714, inventory: 411, days: 125 },
            { name: "Japan", lat: 36.2048, lng: 138.2529, tankage: 590, inventory: 500, days: 240 },
            { name: "South Korea", lat: 35.9078, lng: 127.7669, tankage: 286, inventory: 240, days: 200 },
            { name: "Germany", lat: 51.1657, lng: 10.4515, tankage: 250, inventory: 250, days: 140 },
            { name: "Spain", lat: 40.4637, lng: -3.7492, tankage: 144, inventory: 144, days: 130 },
            { name: "India", lat: 20.5937, lng: 78.9629, tankage: 130, inventory: 75, days: 90 },
            { name: "France", lat: 46.2276, lng: 2.2137, tankage: 65, inventory: 65, days: 95 },
            { name: "Singapore", lat: 1.3521, lng: 103.8198, tankage: 55, inventory: 55, days: 170 },
            { name: "Finland", lat: 61.9241, lng: 25.7482, tankage: 62, inventory: 62, days: 150 },
            { name: "Italy", lat: 41.8719, lng: 12.5674, tankage: 60, inventory: 60, days: 100 },
            { name: "Netherlands", lat: 52.1326, lng: 5.2913, tankage: 55, inventory: 55, days: 95 },
            { name: "Poland", lat: 51.9194, lng: 19.1451, tankage: 50, inventory: 50, days: 110 },
            { name: "Canada", lat: 56.1304, lng: -106.3468, tankage: 45, inventory: 45, days: 60 },
            { name: "South Africa", lat: -30.5595, lng: 22.9375, tankage: 45, inventory: 45, days: 90 },
            { name: "Turkey", lat: 38.9637, lng: 35.2433, tankage: 40, inventory: 40, days: 85 },
            { name: "Sweden", lat: 60.1282, lng: 18.6435, tankage: 35, inventory: 35, days: 110 },
            { name: "Belgium", lat: 50.5039, lng: 4.4699, tankage: 34, inventory: 34, days: 95 },
            { name: "Israel", lat: 31.0461, lng: 34.8516, tankage: 30, inventory: 30, days: 270 },
            { name: "Taiwan", lat: 23.6978, lng: 120.9605, tankage: 27, inventory: 27, days: 120 }
        ];

        let selectedCountry = null;
        let globe = null;

        // Populate country list
        const countryList = document.getElementById('country-list');
        countries.forEach((country, idx) => {
            const item = document.createElement('div');
            item.className = 'country-item';
            item.dataset.country = country.name;
            item.innerHTML = `
                <div class="country-header">
                    <span class="country-name">${idx + 1}. ${country.name}</span>
                    <span class="country-inventory">${country.inventory} Mb</span>
                </div>
                <div class="country-details">
                    <span>Tankage: ${country.tankage} Mb</span>
                    <span>Days: ${country.days}</span>
                </div>
            `;
            item.addEventListener('click', () => focusOnCountry(country));
            countryList.appendChild(item);
        });

        function focusOnCountry(country) {
            selectedCountry = country.name;
            
            // Update selected styling
            document.querySelectorAll('.country-item').forEach(item => {
                if (item.dataset.country === country.name) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });

            if (globe) {
                globe.pointOfView({
                    lat: country.lat,
                    lng: country.lng,
                    altitude: 2
                }, 1000);
            }
        }

        function getColorForDays(days) {
            const normalized = Math.min(days / 270, 1);
            const r = Math.floor(139 * normalized + 255 * (1 - normalized));
            const g = Math.floor(69 * normalized + 255 * (1 - normalized));
            const b = Math.floor(19 * normalized + 255 * (1 - normalized));
            return `rgba(${r}, ${g}, ${b}, 0.7)`;
        }

        // Create ring data - each ring represents 100 Mb
        const ringData = [];
        countries.forEach(country => {
            const fullCircles = Math.floor(country.inventory / 100);
            const partialCircle = (country.inventory % 100) / 100;
            
            // Add full circles
            for (let i = 0; i < fullCircles; i++) {
                ringData.push({
                    lat: country.lat,
                    lng: country.lng,
                    name: country.name,
                    inventory: country.inventory,
                    tankage: country.tankage,
                    days: country.days,
                    altitude: 0.02 + (i * 0.01),
                    size: 0.8,
                    isFull: true
                });
            }
            
            // Add partial circle if exists
            if (partialCircle > 0) {
                ringData.push({
                    lat: country.lat,
                    lng: country.lng,
                    name: country.name,
                    inventory: country.inventory,
                    tankage: country.tankage,
                    days: country.days,
                    altitude: 0.02 + (fullCircles * 0.01),
                    size: 0.8,
                    isFull: false,
                    fillRatio: partialCircle
                });
            }
        });

        // Initialize globe
        const globeContainer = document.getElementById('globe-container');
        globe = Globe()
            (globeContainer)
            .width(globeContainer.offsetWidth)
            .height(window.innerHeight)
            .backgroundColor('#000003')
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
            .atmosphereColor('#4488ff')
            .atmosphereAltitude(0.15)
            
            // Hex polygons for choropleth
            .hexPolygonsData(countries.map(c => ({
                lat: c.lat,
                lng: c.lng,
                days: c.days,
                name: c.name
            })))
            .hexPolygonResolution(3)
            .hexPolygonMargin(0.3)
            .hexPolygonColor(d => getColorForDays(d.days))
            .hexPolygonLabel(d => `
                <div style="background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px; color: white;">
                    <b>${d.name}</b><br/>
                    Days Cover: ${d.days}
                </div>
            `)
            
            // Rings representing inventory - each ring = 100 Mb
            .ringsData(ringData)
            .ringLat('lat')
            .ringLng('lng')
            .ringMaxRadius('size')
            .ringPropagationSpeed(0)
            .ringRepeatPeriod(0)
            .ringAltitude('altitude')
            .ringColor(d => d.isFull ? '#ff8800' : `rgba(255, 136, 0, ${d.fillRatio})`)
            
            // Points for countries - smaller markers
            .pointsData(countries)
            .pointLat('lat')
            .pointLng('lng')
            .pointAltitude(0.01)
            .pointRadius(0.3)
            .pointColor(() => '#ffcc00')
            .pointLabel(d => `
                <div style="background: rgba(0,0,0,0.8); padding: 8px; border-radius: 4px; color: white;">
                    <b>${d.name}</b><br/>
                    Inventory: ${d.inventory} Mb (${Math.floor(d.inventory/100)} rings)<br/>
                    Tankage: ${d.tankage} Mb<br/>
                    Days Cover: ${d.days}
                </div>
            `);

        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.5;

        // Handle window resize
        window.addEventListener('resize', () => {
            globe.width(globeContainer.offsetWidth);
            globe.height(window.innerHeight);
        });
    </script>
</body>
</html>
