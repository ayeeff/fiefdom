<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Oil Reserve - Strategic Cover Map</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Sidebar Styling */
        #sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px; /* Slightly wider for new layout */
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: rgba(10, 20, 15, 0.9);
            border: 1px solid #2e7d32;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            color: #eee;
            z-index: 10;
        }

        #sidebar h2 {
            margin: 0;
            padding: 15px;
            font-size: 15px;
            border-bottom: 1px solid #2e7d32;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #66bb6a;
        }

        .country-item {
            padding: 12px 15px;
            border-bottom: 1px solid #223322;
            cursor: pointer;
            transition: background 0.2s;
        }

        .country-item:hover {
            background: rgba(102, 187, 106, 0.2);
            border-left: 3px solid #ffd700;
        }

        .country-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .country-rank { color: #66bb6a; font-weight: bold; margin-right: 8px; }
        .country-name { font-weight: bold; color: #fff; font-size: 15px; }

        /* New distinct boxes for sidebar stats */
        .sidebar-stats-container {
            display: flex;
            gap: 10px;
        }

        .sidebar-stat-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 6px;
            flex: 1; /* Distribute space evenly */
            text-align: center;
            transition: border-color 0.2s;
        }
        
        .country-item:hover .sidebar-stat-box {
             border-color: #555;
        }

        .sidebar-stat-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .sidebar-stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
        }


        /* Scrollbar styling */
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: #111; }
        #sidebar::-webkit-scrollbar-thumb { background: #2e7d32; border-radius: 3px; }

        /* Legend / Info Box */
        #info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 8px;
            color: #fff;
            max-width: 260px;
            pointer-events: none;
            z-index: 5;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .dot { width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; border: 1px solid #555; }
        .barrel-icon { 
            width: 12px; height: 16px; 
            background: #ffd700; 
            border: 1px solid #bba000;
            border-radius: 3px;
            margin-right: 8px; 
            display: inline-block;
            position: relative;
        }
        /* Add hoops to icon */
        .barrel-icon::before, .barrel-icon::after {
            content: ''; position: absolute; left:0; right:0; height: 2px; background: #886600;
        }
        .barrel-icon::before { top: 4px; }
        .barrel-icon::after { bottom: 4px; }


        /* Bottom Detail Panel (Slide-up) */
        #detail-panel {
            position: absolute;
            bottom: -400px; /* Hidden by default */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(15, 25, 20, 0.95);
            border: 2px solid #ffd700;
            border-bottom: none;
            border-radius: 15px 15px 0 0;
            color: white;
            padding: 20px;
            z-index: 20;
            transition: bottom 0.4s ease-in-out;
            box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.5);
        }

        #detail-panel.active { bottom: 0; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .panel-title { font-size: 24px; font-weight: bold; color: #fff; }
        .panel-sub { font-size: 14px; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; }
        
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .close-btn:hover { color: #fff; }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; text-align: center; }
        .stat-label { font-size: 11px; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #ffd700; }

        .notes-section {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            padding: 10px 15px;
            font-size: 13px;
            line-height: 1.4;
            color: #ddd;
        }
    </style>

    <script src="//unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="//unpkg.com/globe.gl"></script>
    <script src="//unpkg.com/topojson-client"></script>
    <script src="//unpkg.com/d3"></script>
</head>
<body>

    <div id="sidebar">
        <h2>Ranked by Days Cover</h2>
        <div id="country-list"></div>
    </div>

    <div id="info-box">
        <h3 style="margin-top:0; color:#ffd700">Legend</h3>
        <div class="legend-item">
            <span class="barrel-icon"></span> 1 Barrel Icon = 100 Mb
        </div>
        
        <div style="border-top:1px solid #444; margin:10px 0;"></div>
        <div style="font-weight:bold; margin-bottom:8px; font-size:12px; color:#aaa">Import Cover (Days)</div>
        
        <div class="legend-item"><span class="dot" style="background: #1b5e20"></span> 240+ Days</div>
        <div class="legend-item"><span class="dot" style="background: #2e7d32"></span> 200 - 240 Days</div>
        <div class="legend-item"><span class="dot" style="background: #43a047"></span> 160 - 200 Days</div>
        <div class="legend-item"><span class="dot" style="background: #66bb6a"></span> 120 - 160 Days</div>
        <div class="legend-item"><span class="dot" style="background: #a5d6a7"></span> 80 - 120 Days</div>
        <div class="legend-item"><span class="dot" style="background: #c8e6c9"></span> 40 - 80 Days</div>
        <div class="legend-item"><span class="dot" style="background: #e8f5e9"></span> < 40 Days</div>
    </div>

    <div id="detail-panel">
        <div class="panel-header">
            <div>
                <div class="panel-sub" id="panel-rank-display">Rank</div>
                <div class="panel-title" id="panel-country">Country</div>
            </div>
            <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Days Cover</div>
                <div class="stat-value" id="panel-cover">0 Days</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Inventory (2025)</div>
                <div class="stat-value" id="panel-inventory">0 Mb</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Tankage</div>
                <div class="stat-value" id="panel-tankage">0 Mb</div>
            </div>
        </div>
        <div class="notes-section" id="panel-notes">Notes...</div>
    </div>

    <div id="globeViz"></div>

    <script>
        // --- 1. Data Setup ---
        
        const oilData = [
            { rank: 1, country: "China", tankage: 2000, inventory: 1300, cover: 120, lat: 35.8617, lng: 104.1954, notes: "70% import dependent; 11 Mb/d imports; tanks still only ~60% full" },
            { rank: 2, country: "United States", tankage: 714, inventory: 411, cover: 125, lat: 37.0902, lng: -95.7129, notes: "12 Mb/d net imports; draw-down max 4.4 Mb/d" },
            { rank: 3, country: "Japan", tankage: 590, inventory: 500, cover: 240, lat: 36.2048, lng: 138.2529, notes: "IEA obligation 90-days; industry + state tanks; 3.3 Mb/d net imports" },
            { rank: 4, country: "South Korea", tankage: 286, inventory: 240, cover: 200, lat: 35.9078, lng: 127.7669, notes: "Mandatory industry stocks 40-60 days; 2.6 Mb/d imports" },
            { rank: 5, country: "Germany", tankage: 250, inventory: 250, cover: 140, lat: 51.1657, lng: 10.4515, notes: "EBV caverns + industry; 90-days EU rule" },
            { rank: 6, country: "Spain", tankage: 144, inventory: 144, cover: 130, lat: 40.4637, lng: -3.7492, notes: "EU 90-day rule; largely above-ground tanks" },
            { rank: 7, country: "India", tankage: 130, inventory: 75, cover: 90, lat: 20.5937, lng: 78.9629, notes: "5.2 Mb/d imports; 3 new 6.5 Mb sites under construction" },
            { rank: 8, country: "France", tankage: 65, inventory: 65, cover: 95, lat: 46.2276, lng: 2.2137, notes: "SAGESS + industry; 90-day EU obligation" },
            { rank: 9, country: "Singapore", tankage: 55, inventory: 55, cover: 170, lat: 1.3521, lng: 103.8198, notes: "Trading hub; 32 Mb crude + 23 Mb products" },
            { rank: 10, country: "Finland", tankage: 62, inventory: 62, cover: 150, lat: 61.9241, lng: 25.7482, notes: "Baltic pipeline disruption hedge" },
            { rank: 11, country: "Italy", tankage: 60, inventory: 60, cover: 100, lat: 41.8719, lng: 12.5674, notes: "EU 90-day floor; mostly coastal tanks" },
            { rank: 12, country: "Netherlands", tankage: 55, inventory: 55, cover: 95, lat: 52.1326, lng: 5.2913, notes: "Rotterdam-Antwerp ARA hub stocks" },
            { rank: 13, country: "Poland", tankage: 50, inventory: 50, cover: 110, lat: 51.9194, lng: 19.1451, notes: "PERN + EU obligation; new Baltic Pipe" },
            { rank: 14, country: "Canada", tankage: 45, inventory: 45, cover: 60, lat: 56.1304, lng: -106.3468, notes: "Net exporter; stocks held for U.S. Midwest refiners" },
            { rank: 15, country: "South Africa", tankage: 45, inventory: 45, cover: 90, lat: -30.5595, lng: 22.9375, notes: "Saldanha Bay underground; 0.5 Mb/d imports" },
            { rank: 16, country: "Turkey", tankage: 40, inventory: 40, cover: 85, lat: 38.9637, lng: 35.2433, notes: "BOTAS + EU-aligned rules" },
            { rank: 17, country: "Sweden", tankage: 35, inventory: 35, cover: 110, lat: 60.1282, lng: 18.6435, notes: "Coastal product caverns" },
            { rank: 18, country: "Belgium", tankage: 34, inventory: 34, cover: 95, lat: 50.5039, lng: 4.4699, notes: "ARA trading hub" },
            { rank: 19, country: "Israel", tankage: 30, inventory: 30, cover: 270, lat: 31.0461, lng: 34.8516, notes: "Consumption-only rule; 0.25 Mb/d demand" },
            { rank: 20, country: "Taiwan", tankage: 27, inventory: 27, cover: 120, lat: 23.6978, lng: 120.9605, notes: "0.9 Mb/d imports; 30-day commercial mandate" }
        ];

        const sortedData = [...oilData].sort((a, b) => b.cover - a.cover);

        const colorScale = d3.scaleThreshold()
            .domain([40, 80, 120, 160, 200, 240])
            .range(['#e8f5e9', '#c8e6c9', '#a5d6a7', '#66bb6a', '#43a047', '#2e7d32', '#1b5e20']);

        // --- 2. Globe Initialization ---

        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundColor('#050505')
            .pointOfView({ lat: 20, lng: 0, altitude: 2.5 })
            .showAtmosphere(true)
            .atmosphereColor("#66bb6a")
            .atmosphereAltitude(0.15);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // --- 3. Choropleth Layer ---
        
        fetch('//unpkg.com/world-atlas/countries-110m.json').then(res => res.json()).then(data => {
            const countries = topojson.feature(data, data.objects.countries).features;
            
            world.polygonsData(countries)
                .polygonCapColor(d => {
                    const match = oilData.find(o => o.country === d.properties.name || (o.country === "United States" && d.properties.name === "United States of America"));
                    return match ? colorScale(match.cover) : 'rgba(20, 30, 20, 0.8)';
                })
                .polygonSideColor(() => 'rgba(0,0,0,0.5)')
                .polygonStrokeColor(() => '#111')
                .polygonLabel(({ properties: d }) => {
                    const match = oilData.find(o => o.country === d.name || (o.country === "United States" && d.name === "United States of America"));
                    return match ? `<div style="background:#000; color:#fff; padding:5px; border:1px solid #66bb6a;"><b>${match.country}</b><br>Cover: ${match.cover} Days</div>` : null;
                });
        });

        // --- 4. Scattered Barrel Visualization ---

        function createBarrelMesh(opacity = 1.0) {
            const barrelGroup = new THREE.Group();
            // Increased base dimensions slightly
            const r = 0.5; const h = 1.2; 

            const bodyMat = new THREE.MeshLambertMaterial({ color: 0xffd700, transparent: opacity < 1.0, opacity: opacity });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), bodyMat);
            body.position.y = h / 2; 
            barrelGroup.add(body);

            const hoopGeom = new THREE.TorusGeometry(r + 0.03, 0.05, 8, 24);
            const hoopMat = new THREE.MeshLambertMaterial({ color: 0x886600 });
            const hoop1 = new THREE.Mesh(hoopGeom, hoopMat); hoop1.rotation.x = Math.PI / 2; hoop1.position.y = h * 0.3;
            const hoop2 = new THREE.Mesh(hoopGeom, hoopMat); hoop2.rotation.x = Math.PI / 2; hoop2.position.y = h * 0.7;
            barrelGroup.add(hoop1); barrelGroup.add(hoop2);
            
            // **SCALE INCREASE HERE**: Scale x3 to make them "200% larger"
            barrelGroup.scale.set(3, 3, 3); 

            return barrelGroup;
        }

        world.customLayerData(oilData)
            .customThreeObject(d => {
                const group = new THREE.Group();
                
                const fullBarrels = Math.floor(d.inventory / 100);
                const remainder = d.inventory % 100;
                const totalStack = remainder > 0 ? fullBarrels + 1 : fullBarrels;
                
                // Increased scatter radius to accommodate larger barrels
                const scatterRadius = 5.0; 

                for (let i = 0; i < totalStack; i++) {
                    let opacity = (i === totalStack - 1 && remainder > 0) ? 0.6 : 1.0;
                    const barrel = createBarrelMesh(opacity);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.sqrt(Math.random()) * scatterRadius;
                    barrel.position.set(radius * Math.cos(angle), 0, radius * Math.sin(angle));
                    barrel.rotation.y = Math.random() * Math.PI * 2; 
                    
                    group.add(barrel);
                }

                const light = new THREE.PointLight(0xffffff, 1.0, 15);
                light.position.set(0, 10, 0);
                group.add(light);

                return group;
            })
            .customThreeObjectUpdate((obj, d) => {
                Object.assign(obj.position, world.getCoords(d.lat, d.lng, 0.02));
                obj.lookAt(new THREE.Vector3(0,0,0)); 
                obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...Object.values(world.getCoords(d.lat, d.lng, 1))).normalize());
            });

        // Click Hitbox (Increased size for larger barrels)
        world.objectsData(oilData)
            .objectLat('lat') .objectLng('lng') .objectAltitude(0.05)
            .objectThreeObject(() => new THREE.Mesh(new THREE.SphereGeometry(6), new THREE.MeshBasicMaterial({ visible: false })))
            .onObjectClick((d) => showDetails(d));

        // --- 5. Sidebar & Interaction ---

        const listContainer = document.getElementById('country-list');
        
        sortedData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'country-item';
            div.innerHTML = `
                <div class="country-header">
                    <span class="country-rank">${index + 1}.</span>
                    <span class="country-name">${item.country}</span>
                </div>
                <div class="sidebar-stats-container">
                    <div class="sidebar-stat-box">
                        <div class="sidebar-stat-label">Days Cover</div>
                        <div class="sidebar-stat-value">${item.cover}</div>
                    </div>
                    <div class="sidebar-stat-box">
                        <div class="sidebar-stat-label">Inventory</div>
                        <div class="sidebar-stat-value">${item.inventory} Mb</div>
                    </div>
                </div>
            `;
            div.onclick = () => {
                world.pointOfView({ lat: item.lat, lng: item.lng, altitude: 1.5 }, 1500);
                world.controls().autoRotate = false;
                showDetails(item);
            };
            listContainer.appendChild(div);
        });

        function showDetails(data) {
            world.controls().autoRotate = false;
            document.getElementById('panel-rank-display').innerText = "Inventory Rank #" + data.rank;
            document.getElementById('panel-country').innerText = data.country;
            document.getElementById('panel-inventory').innerText = data.inventory + " Mb";
            document.getElementById('panel-tankage').innerText = data.tankage + " Mb";
            document.getElementById('panel-cover').innerText = data.cover + " Days";
            document.getElementById('panel-notes').innerText = data.notes;
            document.getElementById('detail-panel').classList.add('active');
        }

        function closePanel() {
            document.getElementById('detail-panel').classList.remove('active');
            setTimeout(() => { world.controls().autoRotate = true; }, 500);
        }

        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });

    </script>
</body>
</html>
