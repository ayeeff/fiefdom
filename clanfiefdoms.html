<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese EV War: Clans & Fiefdoms</title>
    <script src="//unpkg.com/sunburst-chart"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; /* Ensure full height */
        }
        /* Main container for chart and legend */
        #main-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 90vh; /* Adjust based on header height */
            align-items: center;
            justify-content: center;
        }
        #chart {
            flex: 3; /* Chart takes more space */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #legend {
            flex: 1; /* Legend takes less space */
            height: 80%; /* A bit shorter than chart area */
            overflow-y: auto; /* Scroll if too many items */
            padding: 20px;
            background: rgba(255, 255, 255, 0.05); /* Subtle background */
            border-radius: 8px;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        header {
            height: 10vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        p { margin: 5px 0 0; font-size: 0.9rem; color: #aaa; }
        
        /* Custom Tooltip Styling */
        .sunburst-tooltip {
            background: rgba(0, 0, 0, 0.8) !important;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            padding: 8px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        /* Legend Item Styling */
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .legend-label {
            font-size: 0.9rem;
        }
        .legend-clan-header {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #eee;
            text-transform: uppercase;
            font-size: 0.85rem;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        /* Scrollbar styling for the legend */
        #legend::-webkit-scrollbar {
            width: 8px;
        }
        #legend::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        #legend::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Chinese EV OS "Civil War"</h1>
        <p>Inner Ring: Tech Clan | Middle Ring: Fiefdom (Parent) | Outer Ring: Car Brands</p>
    </header>

    <div id="main-container">
        <div id="chart"></div>
        <div id="legend">
            </div>
    </div>

    <script>
        // Helper function to lighten a color
        function lightenColor(color, percent) {
            var num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        // Base Colors for Clans
        const clanColors = {
            "Huawei HarmonyOS": "#C9171E",
            "Android Skins": "#3DDC84",
            "Geely (Meizu)": "#0066CC",
            "Xiaomi HyperOS": "#FF6900",
            "NIO SkyOS": "#00BED6"
        };

        // Data Structure with colors assigned to Fiefdoms
        const data = {
            name: "China EV Ecosystem",
            color: "#1a1a1a",
            children: [
                {
                    name: "Huawei HarmonyOS",
                    color: clanColors["Huawei HarmonyOS"],
                    children: [
                        {
                            name: "HIMA Alliance",
                            color: lightenColor(clanColors["Huawei HarmonyOS"], 10),
                            os: "HarmonyOS Cockpit",
                            children: [
                                { name: "AITO", value: 40 },
                                { name: "Luxeed", value: 20 },
                                { name: "Stelato", value: 15 },
                                { name: "Maextro", value: 10 }
                            ]
                        },
                        {
                            name: "Huawei Inside Partners",
                            color: lightenColor(clanColors["Huawei HarmonyOS"], 25),
                            os: "HarmonyOS (HI)",
                            children: [
                                { name: "Avatr (Changan)", value: 20 },
                                { name: "Arcfox (BAIC)", value: 15 },
                                { name: "Voyah (Dongfeng)", value: 15 }
                            ]
                        }
                    ]
                },
                {
                    name: "Android Skins",
                    color: clanColors["Android Skins"],
                    children: [
                        {
                            name: "BYD Group",
                            color: lightenColor(clanColors["Android Skins"], 5),
                            os: "DiLink (Open Android)",
                            children: [
                                { name: "BYD", value: 80 },
                                { name: "Yangwang", value: 10 },
                                { name: "Fang Cheng Bao", value: 10 }
                            ]
                        },
                        {
                            name: "XPeng",
                            color: lightenColor(clanColors["Android Skins"], 12),
                            os: "Xmart OS (AI Android)",
                            children: [
                                { name: "XPeng", value: 30 },
                                { name: "Mona", value: 15 }
                            ]
                        },
                        {
                            name: "Li Auto",
                            color: lightenColor(clanColors["Android Skins"], 19),
                            os: "Li OS",
                            children: [
                                { name: "Li Auto", value: 40 }
                            ]
                        },
                        {
                            name: "SAIC Group",
                            color: lightenColor(clanColors["Android Skins"], 26),
                            os: "IM OS / Banma",
                            children: [
                                { name: "IM Motors", value: 15 },
                                { name: "MG (Domestic)", value: 25 },
                                { name: "Rising Auto", value: 10 }
                            ]
                        },
                        {
                            name: "GAC Group",
                            color: lightenColor(clanColors["Android Skins"], 33),
                            os: "ADiGO",
                            children: [
                                { name: "Aion", value: 35 },
                                { name: "Hyper", value: 10 }
                            ]
                        },
                        {
                            name: "GWM",
                            color: lightenColor(clanColors["Android Skins"], 40),
                            os: "Coffee OS",
                            children: [
                                { name: "Ora", value: 15 },
                                { name: "Wey", value: 10 },
                                { name: "Tank", value: 15 }
                            ]
                        },
                        {
                            name: "Leapmotor",
                            color: lightenColor(clanColors["Android Skins"], 47),
                            os: "Leapmotor OS",
                            children: [
                                { name: "Leapmotor", value: 20 }
                            ]
                        }
                    ]
                },
                {
                    name: "Geely (Meizu)",
                    color: clanColors["Geely (Meizu)"],
                    children: [
                        {
                            name: "Flyme Auto Core",
                            color: lightenColor(clanColors["Geely (Meizu)"], 15),
                            os: "Flyme Auto",
                            children: [
                                { name: "Geely Galaxy", value: 25 },
                                { name: "Lynk & Co", value: 20 },
                                { name: "Polestar China", value: 10 }
                            ]
                        },
                        {
                            name: "Custom Skins",
                            color: lightenColor(clanColors["Geely (Meizu)"], 30),
                            os: "Forked Flyme/Android",
                            children: [
                                { name: "Zeekr (Zeekr OS)", value: 35 },
                                { name: "Lotus (Hyper OS)", value: 10 }
                            ]
                        }
                    ]
                },
                {
                    name: "Xiaomi HyperOS",
                    color: clanColors["Xiaomi HyperOS"],
                    children: [
                        {
                            name: "Xiaomi Auto",
                            color: lightenColor(clanColors["Xiaomi HyperOS"], 15),
                            os: "HyperOS",
                            children: [
                                { name: "Xiaomi SU7", value: 40 }
                            ]
                        }
                    ]
                },
                {
                    name: "NIO SkyOS",
                    color: clanColors["NIO SkyOS"],
                    children: [
                        {
                            name: "NIO Inc.",
                            color: lightenColor(clanColors["NIO SkyOS"], 15),
                            os: "SkyOS",
                            children: [
                                { name: "NIO", value: 40 },
                                { name: "Onvo", value: 20 },
                                { name: "Firefly", value: 15 }
                            ]
                        }
                    ]
                }
            ]
        };

        // Generate Legend
        const legendContainer = document.getElementById('legend');
        
        data.children.forEach(clan => {
            // Clan Header
            const clanHeader = document.createElement('div');
            clanHeader.className = 'legend-clan-header';
            clanHeader.textContent = clan.name;
            legendContainer.appendChild(clanHeader);

            // Fiefdom Items
            clan.children.forEach(fiefdom => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                
                const colorBox = document.createElement('div');
                colorBox.className = 'legend-color';
                colorBox.style.backgroundColor = fiefdom.color;
                
                const label = document.createElement('span');
                label.className = 'legend-label';
                label.textContent = fiefdom.name;
                
                item.appendChild(colorBox);
                item.appendChild(label);
                legendContainer.appendChild(item);
            });
        });


        Sunburst()
            .data(data)
            .color(d => d.color || "#cccccc")
            .minSliceAngle(0.4)
            .showLabels(true)
            .tooltipContent((d, node) => {
                // Custom tooltip logic
                if (!node) return '';
                let content = `<strong>${node.data.name}</strong>`;
                
                // Add OS info if available in the parent or current node
                if(node.data.os) {
                    content += `<br/>OS: ${node.data.os}`;
                } else if (node.parent && node.parent.data.os) {
                    content += `<br/>OS: ${node.parent.data.os}`;
                }
                
                // Add Value info
                if (node.value) {
                    content += `<br/><i>Relative Scale: ${node.value}</i>`;
                }
                return content;
            })
            .labelOrientation('angular')
            .radiusScaleExponent(1)
            (document.getElementById('chart'));
            
    </script>
</body>
</html>
