<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese EV War: Clans & Fiefdoms</title>
    <script src="//unpkg.com/sunburst-chart"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Allow vertical scrolling for the whole page */
            overflow-y: auto; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        header {
            width: 100%;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 1px; }
        p { margin: 5px 0 0; font-size: 1rem; color: #aaa; }

        /* Main Layout: Chart + Legend */
        #main-container {
            display: flex;
            flex-direction: row;
            width: 95%; /* Use 95% width for some padding */
            max-width: 1600px;
            height: 80vh; /* Fixed height for the chart area */
            margin-top: 20px;
            align-items: flex-start;
            justify-content: center;
        }

        #chart {
            flex: 3; /* Chart takes the majority of space */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 700px; /* Ensure chart has decent minimum size */
        }

        /* Sidebar for Legend Only */
        #sidebar {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 10px 0;
            border-radius: 8px;
            margin-left: 20px;
            max-width: 350px;
        }

        /* Legend Section */
        #legend {
            padding: 15px;
        }

        .legend-clan-header {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #fff;
            text-transform: uppercase;
            font-size: 1rem; /* Increased font size */
            border-bottom: 2px solid #555;
            padding-bottom: 5px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .legend-color {
            width: 14px; /* Increased size */
            height: 14px;
            border-radius: 3px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .legend-label {
            font-size: 0.95rem; /* Increased font size */
            color: #ddd;
        }

        /* Table Section - Full Width */
        #data-table-container {
            width: 95%;
            max-width: 1600px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #eee;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem; /* Increased font size */
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: rgba(255,255,255,0.07);
            color: #aaa;
            font-weight: 600;
        }
        td {
            color: #ccc;
        }
        tr:hover {
            background-color: rgba(255,255,255,0.05);
        }
        
        /* Sunburst Chart Labels must be styled internally by the library, but we can influence the overall text color */
        svg text {
            fill: #fff !important; /* Forces the text to be white for better contrast */
            font-size: 10px !important; /* Helps make the labels slightly bigger */
        }

        /* Scrollbar for sidebar */
        #sidebar::-webkit-scrollbar { width: 8px; }
        #sidebar::-webkit-scrollbar-track { background: #1a1a1a; }
        #sidebar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        /* Tooltip */
        .sunburst-tooltip {
            background: rgba(0, 0, 0, 0.9) !important;
            border: 1px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-radius: 4px;
            color: #fff;
            padding: 10px;
            font-family: sans-serif;
            font-size: 0.9rem;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Chinese EV OS "Civil War"</h1>
        <p>Inner Ring: Tech Clan | Middle Ring: Fiefdom | Outer Ring: Car Brands</p>
    </header>

    <div id="main-container">
        <div id="chart"></div>
        
        <div id="sidebar">
            <div id="legend">
                </div>
        </div>
    </div>
    
    <div id="data-table-container">
        <h2>The Clans & Fiefdoms of Chinese Auto (Full List)</h2>
        <table id="ev-table">
            <thead>
                <tr>
                    <th>Clan</th>
                    <th>Fiefdom</th>
                    <th>Brands</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        // --- Color Helper ---
        function lightenColor(color, percent) {
            var num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        // --- Data Definitions ---
        
        // 1. Clan Base Colors
        const clanColors = {
            "Huawei HarmonyOS": "#C9171E", // Red
            "Android Skins": "#00695C",    // Dark Teal Base (will expand into gradient)
            "Geely (Meizu)": "#0066CC",    // Blue
            "Xiaomi HyperOS": "#FF6900",   // Orange
            "NIO SkyOS": "#9C27B0"         // Purple (Updated)
        };

        // 2. Android Specific Palette (Gradient from Dark Green to Light Cyan/Teal)
        const androidPalette = {
            "BYD Group": "#2E7D32",   // Forest Green
            "XPeng": "#00897B",       // Teal Green
            "Li Auto": "#009688",     // Teal
            "SAIC Group": "#00ACC1",  // Cyan Dark
            "GAC Group": "#00BCD4",   // Cyan
            "GWM": "#4DD0E1",         // Light Cyan
            "Leapmotor": "#80DEEA"    // Pale Cyan
        };

        // 3. Hierarchy Data
        const rawData = [
            {
                name: "Huawei HarmonyOS",
                color: clanColors["Huawei HarmonyOS"],
                children: [
                    {
                        name: "HIMA Alliance",
                        os: "HarmonyOS Cockpit",
                        children: [{ name: "AITO", value: 40 }, { name: "Luxeed", value: 20 }, { name: "Stelato", value: 15 }, { name: "Maextro", value: 10 }]
                    },
                    {
                        name: "Huawei Inside Partners",
                        os: "HarmonyOS (HI)",
                        children: [{ name: "Avatr (Changan)", value: 20 }, { name: "Arcfox (BAIC)", value: 15 }, { name: "Voyah (Dongfeng)", value: 15 }]
                    }
                ]
            },
            {
                name: "Xiaomi HyperOS",
                color: clanColors["Xiaomi HyperOS"],
                children: [
                    {
                        name: "Xiaomi Auto",
                        os: "HyperOS",
                        children: [{ name: "Xiaomi SU7", value: 40 }]
                    }
                ]
            },
            {
                name: "NIO SkyOS",
                color: clanColors["NIO SkyOS"],
                children: [
                    {
                        name: "NIO Inc.",
                        os: "SkyOS",
                        children: [{ name: "NIO", value: 40 }, { name: "Onvo", value: 20 }, { name: "Firefly", value: 15 }]
                    }
                ]
            },
            {
                name: "Geely (Meizu)",
                color: clanColors["Geely (Meizu)"],
                children: [
                    {
                        name: "Flyme Auto Core",
                        os: "Flyme Auto",
                        children: [{ name: "Geely Galaxy", value: 25 }, { name: "Lynk & Co", value: 20 }, { name: "Polestar China", value: 10 }]
                    },
                    {
                        name: "Custom Skins",
                        os: "Forked Flyme/Android",
                        children: [{ name: "Zeekr (Zeekr OS)", value: 35 }, { name: "Lotus (Hyper OS)", value: 10 }]
                    }
                ]
            },
            {
                name: "Android Skins",
                color: clanColors["Android Skins"],
                children: [
                    { name: "BYD Group", os: "DiLink", children: [{ name: "BYD", value: 80 }, { name: "Yangwang", value: 10 }, { name: "Fang Cheng Bao", value: 10 }] },
                    { name: "XPeng", os: "Xmart OS", children: [{ name: "XPeng", value: 30 }, { name: "Mona", value: 15 }] },
                    { name: "Li Auto", os: "Li OS", children: [{ name: "Li Auto", value: 40 }] },
                    { name: "SAIC Group", os: "IM OS / Banma", children: [{ name: "IM Motors", value: 15 }, { name: "MG (Domestic)", value: 25 }, { name: "Rising Auto", value: 10 }] },
                    { name: "GAC Group", os: "ADiGO", children: [{ name: "Aion", value: 35 }, { name: "Hyper", value: 10 }] },
                    { name: "GWM", os: "Coffee OS", children: [{ name: "Ora", value: 15 }, { name: "Wey", value: 10 }, { name: "Tank", value: 15 }] },
                    { name: "Leapmotor", os: "Leapmotor OS", children: [{ name: "Leapmotor", value: 20 }] }
                ]
            }
        ];

        // --- Process Data for Sunburst ---
        
        function processNode(node, parentColor, depth) {
            let nodeColor = node.color;

            // 1. Assign Color (Clan -> Fiefdom -> Brand)
            if (!nodeColor) {
                // Fiefdom Layer (depth 1)
                if (depth === 1) {
                    // Custom palettes for Android
                    if (androidPalette[node.name]) {
                        nodeColor = androidPalette[node.name];
                    } else {
                        // Default lightening for other Fiefdoms
                        nodeColor = lightenColor(parentColor, 20); 
                    }
                } 
                // Brand Layer (depth 2)
                else if (depth === 2) {
                    // Lighten the Fiefdom color substantially for the outer ring
                    nodeColor = lightenColor(parentColor, 40); 
                }
            }

            const cleanNode = {
                name: node.name,
                color: nodeColor,
                os: node.os,
                value: node.value || 1 // default value
            };

            // 2. Recurse for children
            if (node.children) {
                cleanNode.children = node.children.map(child => {
                    // Normalize child (handle if it's a simple string, add default value)
                    const childObj = (typeof child === 'string') 
                        ? { name: child, value: 20 } 
                        : { ...child, value: child.value || 20 };
                    
                    return processNode(childObj, nodeColor, depth + 1);
                });
            }
            return cleanNode;
        }

        const chartData = {
            name: "China EV Ecosystem",
            color: "#1a1a1a",
            children: rawData.map(d => processNode(d, null, 0))
        };


        // --- Render Chart ---
        Sunburst()
            .data(chartData)
            .color(d => d.color)
            .minSliceAngle(0.4)
            .showLabels(true)
            .tooltipContent((d, node) => {
                if (!node) return '';
                let content = `<strong>${node.data.name}</strong>`;
                if(node.data.os) content += `<br/><span style="color:#aaa; font-size:0.8em">OS: ${node.data.os}</span>`;
                else if (node.parent && node.parent.data.os) content += `<br/><span style="color:#aaa; font-size:0.8em">Parent OS: ${node.parent.data.os}</span>`;
                return content;
            })
            .labelOrientation('angular')
            .radiusScaleExponent(1)
            (document.getElementById('chart'));


        // --- Render Legend & Table ---
        const legendContainer = document.getElementById('legend');
        const tableBody = document.querySelector('#ev-table tbody');
        
        chartData.children.forEach(clan => {
            // 1. Legend Clan Header
            const clanHeader = document.createElement('div');
            clanHeader.className = 'legend-clan-header';
            clanHeader.style.borderColor = clan.color;
            clanHeader.textContent = clan.name;
            legendContainer.appendChild(clanHeader);

            // 2. Loop through Fiefdoms
            clan.children.forEach(fiefdom => {
                // A. Add to Legend
                const item = document.createElement('div');
                item.className = 'legend-item';
                
                const colorBox = document.createElement('div');
                colorBox.className = 'legend-color';
                colorBox.style.backgroundColor = fiefdom.color;
                
                const label = document.createElement('span');
                label.className = 'legend-label';
                label.textContent = fiefdom.name + (fiefdom.os ? ` (${fiefdom.os})` : '');
                
                item.appendChild(colorBox);
                item.appendChild(label);
                legendContainer.appendChild(item);

                // B. Add to Table
                const tr = document.createElement('tr');
                
                const tdClan = document.createElement('td');
                tdClan.textContent = clan.name;
                tdClan.style.color = clan.color;
                
                const tdFiefdom = document.createElement('td');
                tdFiefdom.textContent = fiefdom.name;
                
                const tdBrands = document.createElement('td');
                const brandsList = fiefdom.children ? fiefdom.children.map(c => c.name).join(", ") : "";
                tdBrands.textContent = brandsList;
                tdBrands.style.color = "#888";

                tr.appendChild(tdClan);
                tr.appendChild(tdFiefdom);
                tr.appendChild(tdBrands);
                tableBody.appendChild(tr);
            });
        });

    </script>
</body>
</html>
