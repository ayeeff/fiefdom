<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese EV War: Clans & Fiefdoms</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>body{margin:0;padding:0;background-color:#1a1a1a;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{width:100%;padding:15px 0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#1a1a1a;border-bottom:1px solid #333}h1{margin:0;font-size:1.8rem;letter-spacing:1px}p{margin:5px 0 0;font-size:1rem;color:#aaa}#main-container{display:flex;flex-direction:row;width:95%;max-width:1600px;height:80vh;margin-top:20px;align-items:flex-start;justify-content:center}#chart{flex:3;height:100%;display:flex;justify-content:center;align-items:center;min-width:700px}#sidebar{flex:1;height:100%;display:flex;flex-direction:column;background:rgba(255,255,255,0.05);border-left:1px solid #333;overflow-y:auto;padding:10px 0;border-radius:8px;margin-left:20px;max-width:350px}#legend{padding:15px}.legend-clan-header{font-weight:bold;margin-top:20px;margin-bottom:10px;color:#fff;text-transform:uppercase;font-size:1rem;border-bottom:2px solid #555;padding-bottom:5px}.legend-item{display:flex;align-items:center;margin-bottom:6px}.legend-color{width:14px;height:14px;border-radius:3px;margin-right:10px;flex-shrink:0}.legend-label{font-size:0.95rem;color:#ddd}#data-table-container{width:95%;max-width:1600px;margin:40px auto;padding:20px;background:rgba(255,255,255,0.05);border-radius:8px}h2{font-size:1.2rem;margin-top:0;margin-bottom:15px;color:#eee;border-bottom:1px solid #444;padding-bottom:5px}table{width:100%;border-collapse:collapse;font-size:0.95rem}th,td{text-align:left;padding:10px;border-bottom:1px solid #333}th{background-color:rgba(255,255,255,0.07);color:#aaa;font-weight:600}td{color:#ccc}tr:hover{background-color:rgba(255,255,255,0.05)}svg text{fill:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:11px;font-weight:500;pointer-events:none;text-shadow:1px 1px 2px rgba(0,0,0,0.8)}svg{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}.tooltip{position:absolute;background:rgba(0,0,0,0.95);border:1px solid #555;box-shadow:0 4px 6px rgba(0,0,0,0.3);border-radius:4px;color:#fff;padding:12px;font-family:'Segoe UI',sans-serif;font-size:0.9rem;pointer-events:none;opacity:0;transition:opacity 0.2s}#sidebar::-webkit-scrollbar{width:8px}#sidebar::-webkit-scrollbar-track{background:#1a1a1a}#sidebar::-webkit-scrollbar-thumb{background:#555;border-radius:4px}</style>
</head>
<body>
    <header>
        <h1>The Chinese EV OS "Civil War"</h1>
        <p>Inner Ring: Tech Clan | Middle Ring: Fiefdom | Outer Ring: Car Brands</p>
    </header>
    <div id="main-container">
        <div id="chart"></div>
        <div id="sidebar"><div id="legend"></div></div>
    </div>
    <div id="data-table-container">
        <h2>The Clans & Fiefdoms of Chinese Auto (Full List)</h2>
        <table id="ev-table"><thead><tr><th>Clan</th><th>Fiefdom</th><th>Brands</th></tr></thead><tbody></tbody></table>
    </div>
    <script>function lightenColor(color,percent){var num=parseInt(color.replace("#",""),16),amt=Math.round(2.55*percent),R=(num>>16)+amt,B=(num>>8&0x00FF)+amt,G=(num&0x0000FF)+amt;return "#"+(0x1000000+(R<255?R<1?0:R:255)*0x10000+(B<255?B<1?0:B:255)*0x100+(G<255?G<1?0:G:255)).toString(16).slice(1)}const clanColors={"Huawei HarmonyOS":"#C9171E","Android Skins":"#00695C","Geely (Meizu)":"#0066CC","Xiaomi HyperOS":"#FF6900","NIO SkyOS":"#9C27B0"};const androidPalette={"BYD Group":"#2E7D32","XPeng":"#00897B","Li Auto":"#009688","SAIC Group":"#00ACC1","GAC Group":"#00BCD4","GWM":"#4DD0E1","Leapmotor":"#80DEEA"};const rawData=[{name:"Huawei HarmonyOS",color:clanColors["Huawei HarmonyOS"],children:[{name:"HIMA Alliance",os:"HarmonyOS Cockpit",children:[{name:"AITO",value:40},{name:"Luxeed",value:20},{name:"Stelato",value:15},{name:"Maextro",value:10}]},{name:"Huawei Inside Partners",os:"HarmonyOS (HI)",children:[{name:"Avatr",value:20},{name:"Arcfox",value:15},{name:"Voyah",value:15}]}]},{name:"Xiaomi HyperOS",color:clanColors["Xiaomi HyperOS"],children:[{name:"Xiaomi Auto",os:"HyperOS",children:[{name:"Xiaomi SU7",value:40}]}]},{name:"NIO SkyOS",color:clanColors["NIO SkyOS"],children:[{name:"NIO Inc.",os:"SkyOS",children:[{name:"NIO",value:40},{name:"Onvo",value:20},{name:"Firefly",value:15}]}]},{name:"Geely (Meizu)",color:clanColors["Geely (Meizu)"],children:[{name:"Flyme Auto Core",os:"Flyme Auto",children:[{name:"Geely Galaxy",value:25},{name:"Lynk & Co",value:20},{name:"Polestar",value:10}]},{name:"Custom Skins",os:"Forked Flyme",children:[{name:"Zeekr",value:35},{name:"Lotus",value:10}]}]},{name:"Android Skins",color:clanColors["Android Skins"],children:[{name:"BYD Group",os:"DiLink",children:[{name:"BYD",value:80},{name:"Yangwang",value:10},{name:"Fang Cheng Bao",value:10}]},{name:"XPeng",os:"Xmart OS",children:[{name:"XPeng",value:30},{name:"Mona",value:15}]},{name:"Li Auto",os:"Li OS",children:[{name:"Li Auto",value:40}]},{name:"SAIC Group",os:"IM OS / Banma",children:[{name:"IM Motors",value:15},{name:"MG",value:25},{name:"Rising Auto",value:10}]},{name:"GAC Group",os:"ADiGO",children:[{name:"Aion",value:35},{name:"Hyper",value:10}]},{name:"GWM",os:"Coffee OS",children:[{name:"Ora",value:15},{name:"Wey",value:10},{name:"Tank",value:15}]},{name:"Leapmotor",os:"Leapmotor OS",children:[{name:"Leapmotor",value:20}]}]}];function processNode(node,parentColor,depth){let nodeColor=node.color;if(!nodeColor){if(depth===1){if(androidPalette[node.name]){nodeColor=androidPalette[node.name]}else{nodeColor=lightenColor(parentColor,20)}}else if(depth===2){nodeColor=lightenColor(parentColor,40)}}const cleanNode={name:node.name,color:nodeColor,os:node.os,value:node.value||1};if(node.children){cleanNode.children=node.children.map(child=>{const childObj=(typeof child==='string')?{name:child,value:20}:{...child,value:child.value||20};return processNode(childObj,nodeColor,depth+1)})}return cleanNode}const chartData={name:"China EV Ecosystem",color:"#1a1a1a",children:rawData.map(d=>processNode(d,null,0))};const width=700;const height=700;const radius=Math.min(width,height)/2;const container=d3.select('#chart');const svg=container.append('svg').attr('width',width).attr('height',height).attr('viewBox',`${-width/2} ${-height/2} ${width} ${height}`).style('max-width','100%').style('height','auto');const g=svg.append('g');const tooltip=d3.select('body').append('div').attr('class','tooltip').style('position','absolute').style('opacity',0);const partition=d3.partition().size([2*Math.PI,radius]);const root=d3.hierarchy(chartData).sum(d=>d.value).sort((a,b)=>b.value-a.value);partition(root);const arc=d3.arc().startAngle(d=>d.x0).endAngle(d=>d.x1).padAngle(d=>Math.min((d.x1-d.x0)/2,0.005)).padRadius(radius/2).innerRadius(d=>d.y0).outerRadius(d=>d.y1-1);const paths=g.selectAll('path').data(root.descendants().filter(d=>d.depth>0)).join('path').attr('d',arc).attr('fill',d=>d.data.color).attr('stroke','#1a1a1a').attr('stroke-width',1.5).style('cursor','pointer').on('mouseover',function(event,d){d3.select(this).transition().duration(200).attr('opacity',0.8);let content=`<strong>${d.data.name}</strong>`;if(d.data.os)content+=`<br/><span style="color:#aaa; font-size:0.85em">OS: ${d.data.os}</span>`;tooltip.transition().duration(200).style('opacity',1);tooltip.html(content).style('left',(event.pageX+10)+'px').style('top',(event.pageY-28)+'px')}).on('mouseout',function(){d3.select(this).transition().duration(200).attr('opacity',1);tooltip.transition().duration(500).style('opacity',0)});const labels=g.selectAll('text').data(root.descendants().filter(d=>{const angle=d.x1-d.x0;return d.depth>0&&angle>0.1})).join('text').attr('transform',d=>{const x=(d.x0+d.x1)/2*180/Math.PI;const y=(d.y0+d.y1)/2;return `rotate(${x-90}) translate(${y},0) rotate(${x<180?0:180})`}).attr('dy','0.35em').attr('text-anchor','middle').text(d=>{const angle=d.x1-d.x0;const name=d.data.name;if(angle<0.15)return '';if(angle<0.25&&name.length>8)return name.substring(0,6)+'..';return name}).style('font-size',d=>{const angle=d.x1-d.x0;if(d.depth===1)return '12px';if(d.depth===2)return '10px';return angle>0.3?'11px':'9px'});const legendContainer=document.getElementById('legend');const tableBody=document.querySelector('#ev-table tbody');chartData.children.forEach(clan=>{const clanHeader=document.createElement('div');clanHeader.className='legend-clan-header';clanHeader.style.borderColor=clan.color;clanHeader.textContent=clan.name;legendContainer.appendChild(clanHeader);clan.children.forEach(fiefdom=>{const item=document.createElement('div');item.className='legend-item';const colorBox=document.createElement('div');colorBox.className='legend-color';colorBox.style.backgroundColor=fiefdom.color;const label=document.createElement('span');label.className='legend-label';label.textContent=fiefdom.name+(fiefdom.os?` (${fiefdom.os})`:'');item.appendChild(colorBox);item.appendChild(label);legendContainer.appendChild(item);const tr=document.createElement('tr');const tdClan=document.createElement('td');tdClan.textContent=clan.name;tdClan.style.color=clan.color;const tdFiefdom=document.createElement('td');tdFiefdom.textContent=fiefdom.name;const tdBrands=document.createElement('td');const brandsList=fiefdom.children?fiefdom.children.map(c=>c.name).join(", "):"";tdBrands.textContent=brandsList;tdBrands.style.color="#888";tr.appendChild(tdClan);tr.appendChild(tdFiefdom);tr.appendChild(tdBrands);tableBody.appendChild(tr)})});</script>
</body>
</html>
