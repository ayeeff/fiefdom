<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EEZ + Submarine Internet Cables (Fixed)</title>
  
  <script src="//unpkg.com/globe.gl"></script>

  <style>
    body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    
    #loading { 
      position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      background: rgba(0,0,0,0.8); 
      padding: 20px 40px; 
      border-radius: 12px; 
      color: white; 
      z-index: 1000; 
      text-align: center; 
      transition: opacity 0.5s ease;
    }
    
    #legend { 
      position: absolute; bottom: 20px; left: 20px; 
      background: rgba(0,0,0,0.75); 
      padding: 12px 16px; 
      border-radius: 8px; 
      color: white; 
      font-size: 13px; 
      backdrop-filter: blur(4px); 
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loading"><div style="font-size:48px;margin-bottom:12px">🌍</div>Loading Data...</div>

  <div id="legend">
    <strong>Legend</strong><br>
    <span style="display:inline-block;width:10px;height:10px;background:rgba(62,172,168,0.6);border:1px solid #2A7F7A;margin-right:5px;"></span> EEZ<br>
    <span style="display:inline-block;width:10px;height:2px;background:#00ffff;vertical-align:middle;margin-right:5px;"></span> Submarine Cables
  </div>

  <div id="globeViz"></div>

  <script>
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .pointOfView({ altitude: 2.5 });

    // Controls settings
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    world.controls().addEventListener('start', () => { world.controls().autoRotate = false; });

    // Colors
    const COLOR_EEZ_FILL = 'rgba(62, 172, 168, 0.32)';
    const COLOR_EEZ_STROKE = 'rgba(42, 127, 122, 0.8)';
    const COLOR_CABLE = '#00ffff';

    // Data URLs
    const eezUrl = 'https://raw.githubusercontent.com/ayeeff/fiefdom/main/eez_v12_simplified.json';
    const cableUrl = 'https://raw.githubusercontent.com/ayeeff/fiefdom/main/cable-geo.json';

    // Helper to safely extract features
    function getFeatures(data) {
        // If data is a FeatureCollection, return .features
        // If data is already an array, return data
        // Filter out any item that has no geometry (this fixes the "null reading type" error)
        const list = data.features ? data.features : (Array.isArray(data) ? data : []);
        return list.filter(d => d && d.geometry && d.geometry.type);
    }

    Promise.all([
      fetch(eezUrl).then(res => res.json()),
      fetch(cableUrl).then(res => res.json())
    ]).then(([eezData, cableData]) => {

      const cleanEEZ = getFeatures(eezData);
      const cleanCables = getFeatures(cableData);

      console.log(`Loaded ${cleanEEZ.length} EEZs and ${cleanCables.length} Cables.`);

      // 1. Add EEZs
      world
        .polygonsData(cleanEEZ)
        .polygonCapColor(() => COLOR_EEZ_FILL)
        .polygonSideColor(() => 'rgba(0,0,0,0)')
        .polygonStrokeColor(() => COLOR_EEZ_STROKE)
        .polygonAltitude(0.005)
        .polygonLabel(({ properties: p }) => {
          const name = p.SOVEREIGN1 || p.TERRITORY1 || p.GEONAME || 'Unknown Region';
          return `<b>EEZ:</b> ${name}`;
        });

      // 2. Add Cables
      world
        .pathsData(cleanCables)
        .pathColor(() => COLOR_CABLE)
        .pathDashLength(0)
        .pathStroke(1.5)
        .pathPointAlt(0.008)
        .pathLabel(({ properties: p }) => `<b>Cable:</b> ${p.name || 'Submarine Cable'}`);

      // Hide loading
      document.getElementById('loading').classList.add('hidden');

    }).catch(err => {
      console.error("Error loading data:", err);
      document.getElementById('loading').innerHTML = "Error loading data. See Console.";
    });

  </script>
</body>
</html>
